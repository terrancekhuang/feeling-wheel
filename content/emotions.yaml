# Feeling Wheel — emotion tree (AI draft for review).
#
# How this file works:
#   - Top level = core ring. "children" = middle ring. Their "children" = specific ring.
#   - slug     = the emotion's link (feelingwheel.app/anxious). Lowercase, hyphens, unique.
#   - reviewed = set to true only after you have read and approved the entry.
#   - crisis   = true shows the crisis banner (988 + helplines) on that emotion's page.
#                Crisis flags below are suggestions — please check each one.
#
# Each emotion's page content (all optional while drafting; all required once reviewed: true):
#   god_sees_this: 2–4 verses of lament and company — someone in Scripture who felt this.
#   truth_to_hold: 2–4 verses of promise or reframe.
#   reflection / prayer / action: one question, a 2–4 sentence prayer, one practical step.
#
# Verses: write just the reference — the exact BSB text is filled in for you.
#     - Psalm 42:5
#     - Mark 14:33-34          (ranges up to 4 verses, same chapter)
#     - ref: Psalm 62:1        (quote only part of a verse; must be word-for-word BSB)
#       excerpt: 'In God alone my soul finds rest; my salvation comes from Him.'
#
# Run `pnpm check` for a report. `pnpm dev` shows drafts; `pnpm build` ships reviewed entries only.
#
# Order matters: emotions appear around the wheel in the order written here.

- name: Fear
  slug: fear
  description: a sense that something bad is coming and you can't stop it
  reviewed: true
  god_sees_this:
    - Psalm 55:4
    - Psalm 102:2
  truth_to_hold:
    - Isaiah 41:10
    - Psalm 23:4
  reflection: >-
    What, specifically, are you afraid might happen, and what would it mean to bring that exact fear to God?
  prayer: >-
    Lord, I'm afraid, and I don't want to pretend otherwise. You see what I'm facing more clearly than I do. Stay near me and steady my heart, one step at a time.
  action: >-
    Write your fear down in one honest sentence. Then read Isaiah 41:10 aloud, slowly, over it.
  children:
    - name: Worried
      slug: worried
      description: a mind that keeps circling what might go wrong
      reviewed: true
      god_sees_this:
        - Psalm 13:2
        - Luke 10:41
      truth_to_hold:
        - Matthew 6:34
        - Psalm 94:19
      reflection: >-
        Which of your worries are about today, and which are about a tomorrow that hasn't arrived?
      prayer: >-
        Father, my mind keeps circling the same worries. I hand You the ones I cannot solve today. Give me what I need for this day, and help me leave tomorrow with You.
      action: >-
        List what you're worried about. Circle the one thing you can act on today, do it, and pray over the rest.
      children:
        - name: Anxious
          slug: anxious
          description: a restless dread about what might happen
          reviewed: true
          god_sees_this:
            - Mark 14:33-34
            - ref: Psalm 42:5
              excerpt: 'Why are you downcast, O my soul? Why the unease within me?'
          truth_to_hold:
            - Philippians 4:6-7
            - 1 Peter 5:7
          reflection: >-
            Where do you feel the anxiety in your body right now, and what might it be trying to tell you?
          prayer: >-
            Jesus, You know what it is to be deeply troubled. I bring You this restless dread just as it is. Guard my heart and mind with Your peace, even before anything changes.
          action: >-
            Take five slow breaths. With each one, name one specific request to God. Finish with one thing you're thankful for.
        - name: Restless
          slug: restless
          description: unable to settle, as if something is always unfinished
          reviewed: true
          god_sees_this:
            - Psalm 77:4
            - Job 7:4
          truth_to_hold:
            - Matthew 11:28
            - ref: Psalm 62:1
              excerpt: 'In God alone my soul finds rest; my salvation comes from Him.'
          reflection: >-
            What is keeping you from settling: something unfinished, unsaid or unknown?
          prayer: >-
            Lord, I can't seem to settle. You invited the weary to come to You, so I'm coming. Quiet my mind and teach my soul to rest in You.
          action: >-
            Put your phone in another room for ten minutes. Sit still, and each time your mind wanders, gently pray, "In God alone my soul finds rest."
        - name: Dreading
          slug: dreading
          description: bracing for something you know is coming
          reviewed: true
          god_sees_this:
            - Mark 14:35-36
            - Job 3:25-26
          truth_to_hold:
            - Deuteronomy 31:8
            - Psalm 112:7
          reflection: >-
            What are you bracing for, and what would it look like for God to be with you in that moment?
          prayer: >-
            Father, I'm dreading what's ahead. Like Jesus in the garden, I ask You to take this cup if You can. And if not, go before me and stay with me through it.
          action: >-
            Tell one trusted person what's coming and ask them to pray for you on that day.
    - name: Afraid
      slug: afraid
      description: feeling in danger, whether the threat is near or imagined
      reviewed: true
      god_sees_this:
        - Psalm 31:22
        - Matthew 14:30
      truth_to_hold:
        - Psalm 56:3-4
        - ref: Isaiah 43:1
          excerpt: 'Do not fear, for I have redeemed you; I have called you by your name; you are Mine!'
      reflection: >-
        What is the danger you sense, and is it here now or still ahead?
      prayer: >-
        God, I'm afraid. You call me by name and say I'm Yours. When fear rises, help me put my trust in You again, as many times as it takes.
      action: >-
        Each time the fear rises today, say Psalm 56:3 under your breath: "When I am afraid, I put my trust in You."
      children:
        - name: Terrified
          slug: terrified
          description: fear so strong it is hard to think or move
          reviewed: true
          god_sees_this:
            - Psalm 55:5
            - Psalm 18:4-6
          truth_to_hold:
            - ref: Mark 6:50
              excerpt: 'Take courage! It is I. Do not be afraid.'
            - ref: Psalm 46:1
              excerpt: 'God is our refuge and strength, an ever-present help in times of trouble.'
          reflection: >-
            When fear this strong takes hold, what is the smallest step toward safety or help you could take?
          prayer: >-
            Lord, I'm terrified and I can barely think. Hear my cry and be my refuge. Speak "Take courage, it is I" into this moment.
          action: >-
            If you are in danger, get to safety and call for help now. Otherwise, sit down, plant your feet, and slowly name five things you can see as you breathe.
        - name: Panicked
          slug: panicked
          description: a sudden rush of fear that floods body and mind
          reviewed: true
          god_sees_this:
            - Psalm 38:10
            - Matthew 14:30
          truth_to_hold:
            - ref: Matthew 14:31
              excerpt: 'Immediately Jesus reached out His hand and took hold of Peter.'
            - Isaiah 26:3
          reflection: >-
            When the panic passes, what did you most need to hear in the middle of it?
          prayer: >-
            Lord, save me, I'm sinking. Reach out Your hand and take hold of me as You did for Peter. Keep my mind steady on You until this wave passes.
          action: >-
            Breathe in for four counts, praying "Lord, hold me," and out for six counts, praying "I am Yours." Repeat until your breathing slows.
        - name: Threatened
          slug: threatened
          description: sensing that someone or something is against you
          reviewed: true
          god_sees_this:
            - ref: Psalm 3:1
              excerpt: 'O LORD, how my foes have increased! How many rise up against me!'
            - Psalm 31:13
          truth_to_hold:
            - Psalm 3:3
            - ref: Psalm 27:1
              excerpt: 'The LORD is my light and my salvation—whom shall I fear? The LORD is the stronghold of my life—whom shall I dread?'
          reflection: >-
            Who or what feels like it is against you, and what kind of protection do you most need?
          prayer: >-
            Lord, it feels like so much is against me. Be the shield around me and the One who lifts my head. Show me wise steps to take, and guard me from harm.
          action: >-
            If someone is threatening you, tell a person you trust today, and contact the authorities if you are in danger. Then read Psalm 3 aloud.
    - name: Insecure
      slug: insecure
      description: lacking solid ground under your feet
      reviewed: true
      god_sees_this:
        - Psalm 73:2
        - ref: Psalm 61:2
          excerpt: 'From the ends of the earth I call out to You whenever my heart is faint.'
      truth_to_hold:
        - Psalm 18:2
        - Psalm 62:6
      reflection: >-
        What do you usually lean on to feel steady, and is it holding?
      prayer: >-
        Father, I feel like the ground is shifting under me. You are my rock and my fortress. Set my feet on You, so I will not be shaken.
      action: >-
        Write down three things that are true about God and don't change when your circumstances do. Keep the note where you'll see it.
      children:
        - name: Unsafe
          slug: unsafe
          description: not able to relax because you don't feel protected
          reviewed: true
          god_sees_this:
            - Psalm 142:4
            - ref: Psalm 55:6
              excerpt: 'Oh, that I had wings like a dove! I would fly away and find rest.'
          truth_to_hold:
            - Psalm 91:1-2
            - Psalm 4:8
          reflection: >-
            Where, and with whom, do you feel safest, and how could you get there?
          prayer: >-
            Lord, I don't feel safe. Be my refuge and my fortress. Protect me, lead me to people who will help, and let me lie down in peace tonight.
          action: >-
            If you are in physical danger, contact someone you trust or emergency services now. Otherwise, name one safe person and one safe place, and reach out today.
        - name: Unsure of myself
          slug: unsure-of-myself
          description: doubting your own judgment and ability
          reviewed: true
          god_sees_this:
            - Exodus 4:10
            - Jeremiah 1:6
          truth_to_hold:
            - Exodus 4:11-12
            - 2 Corinthians 12:9
          reflection: >-
            What is God asking of you that feels bigger than you are?
          prayer: >-
            Lord, like Moses I feel I'm not enough for this. You made me, and You know my weakness. Help me as I go, and let Your strength show where mine runs out.
          action: >-
            Write down the one task you doubt you can do. Next to it write "I will help you" (Exodus 4:12), then take the first small step.
        - name: Fragile
          slug: fragile
          description: feeling one more blow could break you
          reviewed: true
          god_sees_this:
            - Psalm 6:2
            - Psalm 31:9
          truth_to_hold:
            - Isaiah 42:3
            - Psalm 34:18
          reflection: >-
            What would it look like to treat yourself as gently as God treats a bruised reed?
          prayer: >-
            Lord, I feel like one more blow could break me. You don't crush bruised reeds. Be near me, heal what hurts, and handle me gently.
          action: >-
            Postpone one non-essential thing today, and use that time to rest or to be with someone safe.
    - name: Overwhelmed
      slug: overwhelmed
      description: more coming at you than you can hold
      reviewed: true
      god_sees_this:
        - 2 Corinthians 1:8
        - Psalm 142:3
      truth_to_hold:
        - ref: Psalm 61:2
          excerpt: 'Lead me to the rock that is higher than I.'
        - Psalm 55:22
        - Isaiah 40:31
      reflection: >-
        If you could set down just one thing you're carrying, which would it be?
      prayer: >-
        Father, it is all too much, and I'm running out of strength. I cast this burden on You. Sustain me, and lead me to the rock that is higher than I.
      action: >-
        Write everything on your mind onto one page. Choose the single next step, and give the rest to God in a one-line prayer.
      children:
        - name: Pressured
          slug: pressured
          description: pushed by demands and expectations from every side
          reviewed: true
          god_sees_this:
            - Exodus 18:18
            - Psalm 25:17
          truth_to_hold:
            - 2 Corinthians 4:8-9
            - Matthew 11:29-30
          reflection: >-
            Whose expectations are you trying to meet, and are they God's?
          prayer: >-
            Jesus, I'm pressed on every side. Teach me to take Your easy yoke instead of the heavy ones I've picked up. Show me what I can lay down.
          action: >-
            Like Moses, you can't carry it alone. Ask one person today to share part of the load.
        - name: Out of control
          slug: out-of-control
          description: life is moving faster than you can steer it
          reviewed: true
          god_sees_this:
            - Mark 4:37-38
            - Psalm 107:27
          truth_to_hold:
            - Mark 4:39
            - Psalm 31:14-15
          reflection: >-
            What part of this is actually in your hands, and what part belongs only to God?
          prayer: >-
            Lord, it feels like the storm is swamping my boat. You have not forgotten me. Speak peace over this storm, and help me trust that my times are in Your hands.
          action: >-
            Divide a page into two columns, "Mine to do" and "God's to hold." Do one thing from the first column today.
        - name: Drowning
          slug: drowning
          description: going under, with no strength left to keep your head up
          reviewed: true
          god_sees_this:
            - ref: Psalm 69:1
              excerpt: 'Save me, O God, for the waters are up to my neck.'
            - Psalm 69:2
            - Jonah 2:5
          truth_to_hold:
            - Psalm 18:16
            - Isaiah 43:2
          reflection: >-
            Who could you let know that you're going under?
          prayer: >-
            Save me, O God. The waters are up to my neck. Reach down and take hold of me, and draw me out of these deep waters.
          action: >-
            Send a short message to someone you trust today: "I'm struggling and could use help." You don't have to explain everything.
    - name: Helpless
      slug: helpless
      description: unable to change what is happening
      reviewed: true
      god_sees_this:
        - 2 Chronicles 20:12
        - ref: Psalm 121:1
          excerpt: 'I lift up my eyes to the hills. From where does my help come?'
      truth_to_hold:
        - Psalm 121:2
        - ref: 2 Chronicles 20:15
          excerpt: 'Do not be afraid or discouraged because of this vast army, for the battle does not belong to you, but to God.'
      reflection: >-
        What would it look like to pray, "We do not know what to do, but our eyes are upon You"?
      prayer: >-
        God, I am powerless before this, and I don't know what to do. My eyes are on You. Fight this battle for me, and show me any part that is mine.
      action: >-
        Pray 2 Chronicles 20:12 out loud, then do one small thing that is within your reach today.
      children:
        - name: Powerless
          slug: powerless
          description: watching something unfold that you cannot stop
          reviewed: true
          god_sees_this:
            - Psalm 88:4
            - ref: Psalm 22:15
              excerpt: 'My strength is dried up like a potsherd, and my tongue sticks to the roof of my mouth.'
          truth_to_hold:
            - Isaiah 40:29
            - ref: Zechariah 4:6
              excerpt: 'Not by might nor by power, but by My Spirit, says the LORD of Hosts.'
            - 2 Corinthians 12:9
          reflection: >-
            Where have you seen God's power work through weakness before, in Scripture or in your own life?
          prayer: >-
            Lord, my strength is dried up and I can't change this. You give power to the faint. Do by Your Spirit what I cannot do by my might.
          action: >-
            Write down one time God came through when you were powerless. Read it again whenever the helplessness rises.
        - name: Trapped
          slug: trapped
          description: seeing no way out of where you are
          reviewed: true
          god_sees_this:
            - Lamentations 3:7
            - ref: Psalm 142:7
              excerpt: 'Free my soul from prison, that I may praise Your name.'
          truth_to_hold:
            - Psalm 18:19
            - Psalm 31:8
          reflection: >-
            What makes you feel there is no way out, and is that feeling the whole truth?
          prayer: >-
            Lord, I feel walled in, and I can't see a way out. Free my soul from this prison. Bring me out into the open place You have for me.
          action: >-
            Ask someone you trust to help you list possible ways forward, even small or imperfect ones. Seeing them written down can loosen the walls.
        - name: Vulnerable
          slug: vulnerable
          description: exposed and open to harm
          reviewed: true
          god_sees_this:
            - Psalm 40:17
            - Psalm 22:11
          truth_to_hold:
            - Psalm 91:4
            - Psalm 121:7-8
          reflection: >-
            Where do you feel exposed, and what kind of covering do you need?
          prayer: >-
            Lord, I am poor and needy and open to harm. Cover me with Your feathers and hide me under Your wings. Guard my coming and going.
          action: >-
            Choose one boundary that would protect you this week, and tell someone you trust about it.

- name: Sadness
  slug: sadness
  description: a heaviness of heart over what is lost, broken or not as it should be
  reviewed: true
  god_sees_this:
    - Psalm 6:6
    - John 11:35
  truth_to_hold:
    - Psalm 56:8
    - Psalm 30:5
  reflection: >-
    What exactly are you sad about, and have you said it to God plainly?
  prayer: >-
    Lord, my heart is heavy. You wept at Lazarus' tomb, so You are not ashamed of my tears. Come near to me in this sadness and comfort me in the way only You can.
  action: >-
    Find a quiet place and tell God what you are sad about, out loud or on paper, without tidying it up. Then read Psalm 56:8 slowly.
  children:
    - name: Grieving
      slug: grieving
      description: mourning someone or something you have lost
      reviewed: true
      god_sees_this:
        - Psalm 42:3
        - ref: Isaiah 53:3
          excerpt: 'He was despised and rejected by men, a man of sorrows, acquainted with grief.'
      truth_to_hold:
        - Matthew 5:4
        - Revelation 21:4
      reflection: >-
        What or who are you grieving, and what do you miss most?
      prayer: >-
        Lord, I am grieving, and this loss feels too big to hold. Jesus, You were a man of sorrows, acquainted with grief, so You understand. Comfort me while I mourn, and one day wipe away every tear.
      action: >-
        Set aside ten minutes to remember what you lost. Say it, or their name, to God, and give thanks for one specific memory.
      children:
        - name: Heartbroken
          slug: heartbroken
          description: a deep ache where love or hope used to be
          reviewed: true
          god_sees_this:
            - Psalm 31:9
            - ref: Psalm 22:14
              excerpt: 'My heart is like wax; it melts away within me.'
          truth_to_hold:
            - Psalm 34:18
            - ref: Isaiah 61:1
              excerpt: 'He has sent Me to bind up the brokenhearted'
          reflection: >-
            What did you love or hope for that now aches, and can you tell God about it in your own words?
          prayer: >-
            Lord, my heart is broken. You say You are near to the brokenhearted, so please be near to me now. Bind up this wound, gently and in Your time.
          action: >-
            Write God a short, honest letter about what broke your heart. Then read Psalm 34:18 over it.
        - name: Bereaved
          slug: bereaved
          description: grieving the death of someone you love
          reviewed: true
          god_sees_this:
            - 2 Samuel 18:33
            - John 11:33-35
          truth_to_hold:
            - 1 Thessalonians 4:13-14
            - John 11:25
          reflection: >-
            What do you most want to say to God about the person you have lost?
          prayer: >-
            Lord, someone I love has died, and the world feels wrong without them. Jesus, You wept at Your friend's grave, so You know this pain. You are the resurrection and the life; let me grieve with hope, and carry me through the hardest days.
          action: >-
            Share a memory of them with someone who knew them, or ask that person for one of theirs. If grief still floods every day months from now, look for a grief group or counsellor.
        - name: Missing someone
          slug: missing-someone
          description: longing for a person who is far away or gone
          reviewed: true
          god_sees_this:
            - 2 Timothy 1:4
            - Philippians 1:8
          truth_to_hold:
            - Romans 8:38-39
            - ref: Hebrews 13:5
              excerpt: 'Never will I leave you, never will I forsake you.'
          reflection: >-
            Who are you missing, and what about them do you miss most?
          prayer: >-
            Father, I miss them, and the space they left feels empty. Thank You for every good thing they brought into my life. Nothing can separate me from Your love, so stay close to me in the missing.
          action: >-
            If you can, send them a message today, even a short one. If you can't, write down what you would say and thank God for them.
    - name: Disappointed
      slug: disappointed
      description: what you hoped for did not happen
      reviewed: true
      god_sees_this:
        - ref: Luke 24:21
          excerpt: 'But we were hoping He was the One who would redeem Israel.'
        - Proverbs 13:12
      truth_to_hold:
        - Romans 5:5
        - Psalm 27:13-14
      reflection: >-
        What were you hoping for, and what does its not happening seem to say to you?
      prayer: >-
        Lord, I hoped for this and it didn't happen. Like the disciples on the road to Emmaus, I'm confused and let down. Walk with me in it, and show me what You are doing that I can't yet see.
      action: >-
        Tell God plainly what you hoped for. Then name one good thing He has given you that you didn't expect.
      children:
        - name: Let down
          slug: let-down
          description: someone you counted on did not come through
          reviewed: true
          god_sees_this:
            - 2 Timothy 4:16
            - Psalm 142:4
          truth_to_hold:
            - ref: 2 Timothy 4:17
              excerpt: 'But the Lord stood by me and strengthened me'
            - Isaiah 49:15
          reflection: >-
            Who let you down, and what did you need from them that you didn't get?
          prayer: >-
            Lord, I counted on them and they didn't come through. Paul knew this too, and You stood by him. Stand by me now, and help me be honest about the hurt without letting it harden my heart.
          action: >-
            Decide whether to talk to them about it or let it go. If you talk, start with what you needed, not with what they did wrong.
        - name: Discouraged
          slug: discouraged
          description: losing the heart to keep trying
          reviewed: true
          god_sees_this:
            - Nehemiah 4:10
            - Psalm 69:3
          truth_to_hold:
            - Galatians 6:9
            - 2 Corinthians 4:16
          reflection: >-
            What made you want to stop trying, and what part of it is still worth one more try?
          prayer: >-
            Lord, I'm losing heart. I've tried, and I'm tired of trying. Renew me inwardly day by day, and give me enough courage for the next small step.
          action: >-
            Pick the smallest next step, something you could do in ten minutes, and do it today. Then rest without guilt.
        - name: Unfulfilled
          slug: unfulfilled
          description: life feels smaller than you thought it would be
          reviewed: true
          god_sees_this:
            - Ecclesiastes 2:11
            - ref: Psalm 63:1
              excerpt: 'my soul thirsts for You. My body yearns for You in a dry and weary land without water.'
          truth_to_hold:
            - Ephesians 2:10
            - Psalm 16:11
          reflection: >-
            Where does life feel smaller than you hoped, and what do you think would make it feel full?
          prayer: >-
            Father, my life feels smaller than I imagined, and some of what I chased hasn't satisfied. Show me the path of life, and the good works You prepared for me, even the quiet ones.
          action: >-
            Think of one small way to serve someone this week, and do it. Afterwards, notice how it felt.
    - name: Hurt
      slug: hurt
      description: wounded by what someone said or did
      reviewed: true
      god_sees_this:
        - Psalm 69:20
        - Psalm 109:22
      truth_to_hold:
        - Psalm 147:3
        - 1 Peter 2:23
      reflection: >-
        What was said or done, and what did it make you believe about yourself?
      prayer: >-
        Lord, what they said and did hurt me. You were abused too, and You entrusted Yourself to the One who judges justly. Heal this wound, and help me leave the judging to You.
      action: >-
        Write down what happened and the lie it left you with. Next to it, write what God says is true about you.
      children:
        - name: Wounded
          slug: wounded
          description: carrying an injury that hasn't healed
          reviewed: true
          god_sees_this:
            - ref: Jeremiah 15:18
              excerpt: 'Why is my pain unending, and my wound incurable, refusing to be healed?'
            - Psalm 6:2
          truth_to_hold:
            - ref: Jeremiah 30:17
              excerpt: 'But I will restore your health and heal your wounds, declares the LORD'
            - Isaiah 42:3
          reflection: >-
            What old hurt still aches when it's touched, and what might help it heal?
          prayer: >-
            Lord, this wound hasn't healed, and sometimes it feels like it never will. You don't break a bruised reed. Be gentle with me, and heal what I can't heal myself.
          action: >-
            Name the wound to one trusted person, a friend, pastor or counsellor, and ask them to help you carry it.
        - name: Betrayed
          slug: betrayed
          description: hurt by someone you trusted
          reviewed: true
          god_sees_this:
            - Psalm 55:12-14
            - Luke 22:48
          truth_to_hold:
            - ref: Genesis 50:20
              excerpt: 'what you intended against me for evil, God intended for good'
            - Psalm 27:10
          reflection: >-
            What did you trust them with, and what do you need now to feel safe?
          prayer: >-
            Jesus, You were betrayed with a kiss by someone who shared Your table. You know this pain. Protect my heart, show me what is wise, and in Your time bring good even out of this.
          action: >-
            Put some healthy distance in place if you need it. Then tell God exactly what they did, and leave the outcome with Him for today.
        - name: Crushed
          slug: crushed
          description: pressed down so hard you can barely stand
          reviewed: true
          god_sees_this:
            - Psalm 38:8
            - ref: Psalm 143:3
              excerpt: 'For the enemy has pursued my soul, crushing my life to the ground'
          truth_to_hold:
            - 2 Corinthians 4:8-9
            - Psalm 34:19
          reflection: >-
            What is pressing down on you, and what is one thing you could set down today?
          prayer: >-
            Lord, I am pressed so hard I can barely stand. Hold me so that I'm hard pressed but not crushed. Deliver me, and give me strength for just this day.
          action: >-
            Cancel or postpone one non-essential thing today, and use the time to rest or ask someone for help.
    - name: Downcast
      slug: downcast
      description: a low, heavy spirit that won't lift
      reviewed: true
      god_sees_this:
        - Psalm 38:6
        - Psalm 143:4
      truth_to_hold:
        - Psalm 42:11
        - Psalm 3:3
      reflection: >-
        When did this heaviness start, and is there something underneath it you haven't named yet?
      prayer: >-
        Lord, my spirit is low and won't lift. Like the psalmist, I ask my soul why it is downcast, and I choose to hope in You. Lift my head when I can't lift it myself.
      action: >-
        Get outside for fifteen minutes today, in daylight if you can. If this low mood has lasted more than two weeks, tell a doctor or counsellor.
      children:
        - name: Heavy-hearted
          slug: heavy-hearted
          description: a weight on your chest you can't put down
          reviewed: true
          god_sees_this:
            - Matthew 26:38
            - ref: Psalm 31:10
              excerpt: 'For my life is consumed with grief and my years with groaning'
          truth_to_hold:
            - Matthew 11:28
            - Psalm 55:22
          reflection: >-
            What weight are you carrying, and does anyone else know about it?
          prayer: >-
            Jesus, Your soul was so heavy that You asked Your friends to stay with You. My heart is heavy too. I come to You weary and burdened; give me rest, and carry what I can't.
          action: >-
            Tell one person today, "I'm carrying something heavy," and let them pray with you or simply sit with you.
        - name: Gloomy
          slug: gloomy
          description: everything seems grey and dim
          reviewed: true
          god_sees_this:
            - Job 30:26
            - Psalm 88:18
          truth_to_hold:
            - John 1:5
            - ref: Micah 7:8
              excerpt: 'though I sit in darkness, the LORD will be my light.'
          reflection: >-
            Is there one small place today, however dim, where you can still see some light?
          prayer: >-
            Lord, everything looks grey right now. Darkness is not dark to You. Shine into this dimness, and help me notice even small glimpses of Your goodness.
          action: >-
            Open a curtain or step outside, and spend five minutes noticing one good thing: light, a sound, a taste. Thank God for it by name.
        - name: Empty
          slug: empty
          description: hollow inside, as if nothing is left
          reviewed: true
          crisis: true
          god_sees_this:
            - Job 30:16
            - Psalm 88:3
          truth_to_hold:
            - Psalm 73:26
            - Psalm 107:9
          reflection: >-
            When you feel empty, what do you usually reach for, and does it fill you?
          prayer: >-
            Lord, I feel hollow, as if nothing is left. I don't have much to bring You, so I bring You this emptiness. Be the strength of my heart, and slowly fill me again.
          action: >-
            Do one small life-giving thing today: eat a real meal, step outside, or message a friend. If the emptiness won't lift, talk to a doctor or counsellor.
    - name: Hopeless
      slug: hopeless
      description: unable to see how things could ever get better
      reviewed: true
      crisis: true
      god_sees_this:
        - Job 17:15
        - Lamentations 3:17-18
      truth_to_hold:
        - Lamentations 3:21-23
        - Romans 15:13
      reflection: >-
        What has made things feel like they can't get better, and who could help you carry it today?
      prayer: >-
        God, I can't see how this gets better, and my hope feels gone. But Your mercies are new every morning, so I'm asking for today's. Hold on to me when I can't hold on to You.
      action: >-
        Tell someone today how hopeless you feel: a friend, a pastor, a doctor or a crisis line. You don't have to feel hopeful to ask for help.
      children:
        - name: Despairing
          slug: despairing
          description: hope feels completely gone
          reviewed: true
          crisis: true
          god_sees_this:
            - 2 Corinthians 1:8
            - ref: Psalm 22:1
              excerpt: 'My God, my God, why have You forsaken me? Why are You so far from saving me, so far from my words of groaning?'
          truth_to_hold:
            - Psalm 40:2
            - ref: 2 Corinthians 1:10
              excerpt: 'He has delivered us from such a deadly peril, and He will deliver us.'
          reflection: >-
            Despair says nothing will ever change. Who could you let into this with you today?
          prayer: >-
            Lord, I'm in the pit and I can't see a way out. Paul despaired even of life, and You delivered him. Hear my cry, lift me out, and set my feet on a rock.
          action: >-
            Please don't carry this alone. Today, reach out to one person, a friend, a pastor or a doctor, or call or text 988, and say plainly, "I'm in despair."
        - name: Defeated
          slug: defeated
          description: you've fought and feel you have lost
          reviewed: true
          god_sees_this:
            - Joshua 7:7
            - Psalm 44:9
          truth_to_hold:
            - Psalm 37:24
            - ref: 2 Corinthians 12:9
              excerpt: 'My grace is sufficient for you, for My power is perfected in weakness.'
          reflection: >-
            What did you fight for and lose, and is God asking you to rise, to rest, or to let it go?
          prayer: >-
            Lord, I fought and I lost, and I feel beaten. Remind me that falling isn't the end, because You are holding my hand. Let Your power show up in my weakness.
          action: >-
            Write down what you lost and one thing you learned in the fight. Rest today; getting back up can start tomorrow.
        - name: Not wanting to live
          slug: not-wanting-to-live
          description: thoughts of not wanting to be here anymore
          reviewed: true
          crisis: true
          god_sees_this:
            - ref: 1 Kings 19:4
              excerpt: 'He sat down under a broom tree and prayed that he might die. “I have had enough, LORD,” he said. “Take my life, for I am no better than my fathers.”'
            - Job 3:11
          truth_to_hold:
            - 1 Kings 19:5-7
            - Psalm 139:16
          reflection: >-
            Who is one safe person you could tell today that you've been having these thoughts?
          prayer: >-
            God, I don't want to be here anymore, and I'm telling You honestly. You didn't turn away from Elijah when he asked to die; You gave him sleep, food and a way forward. Meet me like that, and help me reach out for help today.
          action: >-
            Please tell someone now. Call or text 988, use the helpline link above, or ask a trusted person to stay with you. If you might act on these thoughts, call your local emergency number.

- name: Anger
  slug: anger
  description: heat rising against something that feels wrong
  reviewed: true
  god_sees_this:
    - Mark 3:5
    - Psalm 39:3
  truth_to_hold:
    - ref: Psalm 4:4
      excerpt: 'Be angry, yet do not sin; on your bed, search your heart and be still.'
    - James 1:19-20
    - Psalm 103:8
  reflection: >-
    What is your anger telling you is wrong, and what do you want to do with it?
  prayer: >-
    Lord, I am angry, and I won't pretend I'm not. Jesus, You were angry at hardness of heart, so You understand this heat. Help me tell You the truth about it, and keep me from sinning in it.
  action: >-
    Before you speak or act, pause. Write down what made you angry and what you wish would happen. Then read Psalm 4:4 and, if you can, sleep on it before you respond.
  children:
    - name: Frustrated
      slug: frustrated
      description: blocked again and again from what you want or need
      reviewed: true
      god_sees_this:
        - Exodus 5:22-23
        - Numbers 11:14
      truth_to_hold:
        - Galatians 6:9
        - Proverbs 3:5-6
      reflection: >-
        What keeps blocking you, and which part of it is actually in your hands?
      prayer: >-
        Father, I keep running into the same wall, and I'm tired of it. Moses brought You his frustration, so I bring You mine. Show me what is mine to do, and give me patience for what is not.
      action: >-
        Write down what keeps blocking you. Split it into what you can change and what you can't. Take one small step on the first list today, and hand the second list to God in prayer.
      children:
        - name: Irritated
          slug: irritated
          description: small things keep rubbing you the wrong way
          reviewed: true
          god_sees_this:
            - Luke 10:40
            - Numbers 20:10
          truth_to_hold:
            - Proverbs 19:11
            - Proverbs 15:1
          reflection: >-
            Is it really the small things, or is something bigger underneath making everything rub?
          prayer: >-
            Lord, everything is getting under my skin today. Calm me before I say something I regret. Show me what's really underneath this, and give me grace to overlook what I can.
          action: >-
            When you feel yourself about to snap, stop and take three slow breaths. Ask whether you're tired, hungry, or carrying something else, and look after that first.
        - name: Impatient
          slug: impatient
          description: tired of waiting and wanting it done now
          reviewed: true
          god_sees_this:
            - ref: Psalm 13:1
              excerpt: 'How long, O LORD? Will You forget me forever?'
            - Psalm 6:3
          truth_to_hold:
            - Lamentations 3:25-26
            - Habakkuk 2:3
            - Psalm 31:15
          reflection: >-
            What are you waiting for, and what is the waiting doing in you?
          prayer: >-
            Lord, I'm tired of waiting and I want this done now. My times are in Your hands, even when Your timing feels slow. Help me wait without giving up, and show me what to do in the meantime.
          action: >-
            Name the thing you're waiting for. Then pick one good thing you can do today while you wait, and do it.
        - name: Stuck
          slug: stuck
          description: pushing hard and going nowhere
          reviewed: true
          god_sees_this:
            - Job 19:8
            - Romans 7:19
          truth_to_hold:
            - Psalm 118:5
            - Isaiah 43:19
            - 2 Corinthians 12:9
          reflection: >-
            Where are you pushing hardest, and what would it look like to stop pushing and ask for help?
          prayer: >-
            Lord, I'm pushing as hard as I can and getting nowhere. I'm out of ideas and out of strength. Make a way where I can't see one, and let Your power show up in my weakness.
          action: >-
            Stop pushing for a day. Tell one person you trust where you're stuck and ask what they see. Sometimes the next step only shows up when someone else looks.
    - name: Bitter
      slug: bitter
      description: an old hurt that has hardened inside
      reviewed: true
      god_sees_this:
        - Ruth 1:20
        - Job 7:11
      truth_to_hold:
        - Hebrews 12:15
        - Ephesians 4:31-32
      reflection: >-
        What hurt is underneath the bitterness, and have you ever told God how much it cost you?
      prayer: >-
        Lord, this old hurt has turned sour in me. Like Naomi, I feel life has dealt bitterly with me. Pull up this root before it spreads, and heal the wound underneath it.
      action: >-
        Write down the hurt your bitterness is guarding: who, what, and what it cost you. Read it to God, then read Ephesians 4:31-32.
      children:
        - name: Resentful
          slug: resentful
          description: replaying a wrong and holding it against someone
          reviewed: true
          god_sees_this:
            - Psalm 55:12-13
            - Luke 15:29
          truth_to_hold:
            - 1 Peter 2:23
            - Colossians 3:13
          reflection: >-
            How many times have you replayed this wrong, and what does replaying it give you?
          prayer: >-
            Lord, I keep replaying what they did. You saw all of it, and You judge justly. I hand this wrong to You, and I ask You to loosen its grip on my mind.
          action: >-
            The next time the memory replays, stop and pray one sentence for the person, even if all you can say is, "Lord, deal with them justly."
        - name: Unforgiving
          slug: unforgiving
          description: unable or unwilling to let a debt go
          reviewed: true
          god_sees_this:
            - Matthew 18:21
            - Psalm 109:4-5
          truth_to_hold:
            - Luke 23:34
            - Ephesians 4:32
            - Genesis 50:20
          reflection: >-
            What would forgiving them mean for you, and what would it not mean?
          prayer: >-
            Lord, I don't feel ready to forgive. What they did was real, and You know it. You have forgiven me so much; help me begin to release this debt to You, even if it takes time.
          action: >-
            Write down what they owe you, then write "I hand this to God" across it. Forgiving doesn't mean trusting them again or pretending it was fine. If it isn't safe to be near them, keep your distance.
        - name: Hardened
          slug: hardened
          description: closing your heart so it can't be hurt again
          reviewed: true
          god_sees_this:
            - Psalm 77:2
            - Jeremiah 31:15
          truth_to_hold:
            - Ezekiel 36:26
            - Isaiah 42:3
            - Psalm 147:3
          reflection: >-
            What happened that made you close your heart, and what has keeping it closed cost you?
          prayer: >-
            Lord, I shut my heart so it couldn't be hurt again, and now it feels like stone. You don't break bruised reeds. Gently soften what I've walled off, and make it safe to feel again.
          action: >-
            Tell one trusted person about the hurt you've been guarding against. Start small; one honest sentence is enough.
    - name: Enraged
      slug: enraged
      description: anger that feels too big to contain
      reviewed: true
      god_sees_this:
        - Jonah 4:9
        - Genesis 4:6
      truth_to_hold:
        - Proverbs 16:32
        - Psalm 103:8
      reflection: >-
        What would happen if you acted on this anger right now, and who would get hurt?
      prayer: >-
        God, this anger feels too big for me. You are slow to anger and rich in love; lend me Your patience. Hold me back from doing harm, and help me bring this fire to You instead.
      action: >-
        Step away now: leave the room, take a walk, or put the phone down. Don't send or say anything until you've calmed down. If you're afraid you might hurt someone, call someone you trust right away.
      children:
        - name: Furious
          slug: furious
          description: burning, explosive anger
          reviewed: true
          god_sees_this:
            - Psalm 39:3
            - Jonah 4:4
          truth_to_hold:
            - Ephesians 4:26-27
            - Proverbs 29:11
            - Psalm 37:8
          reflection: >-
            What set this off, and what hurt or fear is under the fury?
          prayer: >-
            Lord, I am burning with anger right now. Cool my body and slow my words. Show me the hurt underneath, and keep me from doing what I'll regret.
          action: >-
            Move your body: walk fast, or climb the stairs until the surge passes. Then write down what set you off before you speak to anyone about it.
        - name: Vengeful
          slug: vengeful
          description: wanting the one who hurt you to pay
          reviewed: true
          god_sees_this:
            - Psalm 58:6
            - Psalm 7:6
          truth_to_hold:
            - Romans 12:19
            - Proverbs 20:22
            - Romans 12:21
          reflection: >-
            What do you want them to suffer, and can you hand that exact wish to God instead of acting on it?
          prayer: >-
            God, I want them to pay for what they did. The psalmists prayed this honestly to You, so I will too. Vengeance is Yours, not mine. Do what is just, and keep my hands from harm.
          action: >-
            Tell God your wish for revenge, out loud or on paper, and leave it with Him. If you are planning to hurt someone, stop and talk to a trusted person or counsellor today.
    - name: Wronged
      slug: wronged
      description: treated unfairly, and it isn't being made right
      reviewed: true
      god_sees_this:
        - Psalm 35:11-12
        - Job 19:7
      truth_to_hold:
        - Psalm 10:14
        - Deuteronomy 32:4
      reflection: >-
        What was done to you, and what would "made right" look like?
      prayer: >-
        Lord, I was treated unfairly, and no one is making it right. You see it all, and You love justice. Defend my cause, and keep me from turning bitter while I wait.
      action: >-
        Write down plainly what happened. If there's a fair way to seek justice, like a conversation, a complaint or a report, take the first step. Leave the rest with God.
      children:
        - name: Cheated
          slug: cheated
          description: robbed of what was rightfully yours
          reviewed: true
          god_sees_this:
            - Genesis 27:36
            - Genesis 31:41
          truth_to_hold:
            - Genesis 31:42
            - Joel 2:25
            - ref: Isaiah 61:8
              excerpt: 'For I, the LORD, love justice; I hate robbery and iniquity'
          reflection: >-
            What was taken from you, and what do you fear it means for your future?
          prayer: >-
            Lord, I was robbed of what was mine. Laban cheated Jacob, but You saw his toil and did not let him be sent away empty-handed. See me too, and provide what was taken.
          action: >-
            If you can, seek fair redress: ask for it back, get advice, or report it. Then tell God exactly what you lost.
        - name: Disrespected
          slug: disrespected
          description: treated as if you don't matter
          reviewed: true
          god_sees_this:
            - Psalm 123:3-4
            - Psalm 69:20
          truth_to_hold:
            - ref: Isaiah 43:4
              excerpt: 'Because you are precious and honored in My sight, and because I love you'
            - Luke 12:7
          reflection: >-
            Whose opinion of you is weighing on you, and what does God say about your worth?
          prayer: >-
            Lord, I was treated as if I don't matter. Jesus, You were mocked and scorned, so You know this sting. Remind me that I am precious and honoured in Your sight.
          action: >-
            Read Isaiah 43:4 aloud. If the disrespect keeps happening, decide on one calm, clear boundary and say it. If someone is mistreating or abusing you, tell a person you trust.
        - name: Indignant
          slug: indignant
          description: angry at injustice done to you or to others
          reviewed: true
          god_sees_this:
            - Habakkuk 1:2-3
            - Psalm 94:3
          truth_to_hold:
            - Psalm 7:11
            - Amos 5:24
            - Micah 6:8
          reflection: >-
            What injustice is stirring you, and what one thing could you do about it?
          prayer: >-
            Lord, I'm angry at what's being done. You love justice more than I do. Let this anger move me to do right, not to hate, and bring justice where I can't.
          action: >-
            Choose one concrete way to act on this injustice this week: speak up, give, volunteer, or stand with someone affected.
    - name: Envious
      slug: envious
      description: pained by what others have that you don't
      reviewed: true
      god_sees_this:
        - Psalm 73:2-3
        - Psalm 73:21-22
      truth_to_hold:
        - Psalm 73:25-26
        - Proverbs 14:30
      reflection: >-
        What do they have that you want, and what do you believe it would give you?
      prayer: >-
        Lord, I'm envious of what others have. Like Asaph, I looked at them and nearly slipped. Be my portion, and teach me to want You more than what they have.
      action: >-
        Name what you envy and who has it. Pray a blessing over that person by name, then thank God for three things He has given you.
      children:
        - name: Jealous
          slug: jealous
          description: afraid of losing what or who you love to someone else
          reviewed: true
          god_sees_this:
            - Genesis 30:1
            - ref: Song of Solomon 8:6
              excerpt: 'For love is as strong as death, its jealousy as unrelenting as Sheol.'
          truth_to_hold:
            - 1 John 4:18
            - Jeremiah 31:3
          reflection: >-
            What are you afraid of losing, and what would it mean to you if you did?
          prayer: >-
            Lord, I'm afraid of losing someone I love, and I'm holding on too tightly. Remind me of Your everlasting love, and help me love without fear.
          action: >-
            Name the fear behind your jealousy in one sentence. If it's about a relationship, talk honestly with the person, calmly and without accusing.
        - name: Discontent
          slug: discontent
          description: unable to be at peace with what you have
          reviewed: true
          god_sees_this:
            - Numbers 11:4-5
            - Ecclesiastes 4:4
          truth_to_hold:
            - Philippians 4:11
            - Psalm 16:5-6
            - 1 Timothy 6:6
          reflection: >-
            What do you keep thinking would finally make you content?
          prayer: >-
            Lord, I can't seem to be at peace with what I have. Paul learned to be content; teach me too. Be my portion, and open my eyes to the good You've already given.
          action: >-
            Write down ten things you have today that you're grateful for, then read the list aloud to God.
    - name: Angry with God
      slug: angry-with-god
      description: hurt and angry at God for what He has allowed
      reviewed: true
      god_sees_this:
        - Job 30:20-21
        - Psalm 88:14
      truth_to_hold:
        - ref: Psalm 62:8
          excerpt: 'Trust in Him at all times, O people; pour out your hearts before Him. God is our refuge.'
        - Hebrews 4:15-16
      reflection: >-
        What do you want to say to God about what He allowed, and have you said it to Him directly?
      prayer: >-
        God, I'm angry with You. I don't understand why You allowed this. Job poured out his anguish to You, and You answered him; I'm bringing mine to You too. Please don't let go of me.
      action: >-
        Pour out your heart to God, out loud or on paper. Don't clean it up; He can handle it. Then read Psalm 62:8.
      children:
        - name: Disappointed in God
          slug: disappointed-in-god
          description: God did not do what you hoped He would
          reviewed: true
          god_sees_this:
            - John 11:21
            - Psalm 22:2
          truth_to_hold:
            - Isaiah 55:8-9
            - Lamentations 3:22-23
          reflection: >-
            What did you hope God would do, and what did it mean to you when He didn't?
          prayer: >-
            Lord, I hoped You would act, and You didn't. Like Martha, I want to say, "If You had been here." I don't understand Your ways, but I'm still here talking to You. Meet me in this disappointment.
          action: >-
            Finish this sentence to God, honestly: "Lord, if You had..." Then read John 11:32-35 and notice how Jesus met Mary in her disappointment.
        - name: Feeling God is unfair
          slug: god-is-unfair
          description: it seems God blesses others and passes you by
          reviewed: true
          god_sees_this:
            - Jeremiah 12:1
            - Psalm 73:13
          truth_to_hold:
            - Luke 15:31
            - Psalm 145:17
          reflection: >-
            Who seems blessed in a way you're not, and what do you want God to give you?
          prayer: >-
            Lord, it seems You bless others and pass me by. Like Jeremiah, I want to plead my case with You. Show me that You are with me, and that what is Yours is mine, even when I can't see it.
          action: >-
            Write down what feels unfair as an honest complaint to God, the way Jeremiah did. Then list three ways God has been with you that you might have missed.

- name: Shame
  slug: shame
  description: feeling that something is wrong with who you are
  reviewed: false
  god_sees_this:
    - Genesis 3:10
    - ref: Psalm 44:15
      excerpt: 'All day long my disgrace is before me, and shame has covered my face'
    - Psalm 69:19
  truth_to_hold:
    - Psalm 34:5
    - Hebrews 12:2
    - Romans 8:1
  reflection: >-
    What is the voice of shame saying about who you are, and would God say the same thing?
  prayer: >-
    Lord, part of me wants to hide from You, the way Adam hid in the garden. But You already see me, and You still call me by name. Lift my face, and let me hear what You say about me instead of what shame says.
  action: >-
    Write down the sentence shame keeps saying to you. Next to it, write Romans 8:1. Read them side by side, and decide which one you will believe today.
  children:
    - name: Guilty
      slug: guilty
      description: knowing you have done wrong
      reviewed: false
      god_sees_this:
        - Psalm 51:3
        - Psalm 38:4
      truth_to_hold:
        - 1 John 1:9
        - ref: Psalm 32:5
          excerpt: 'Then I acknowledged my sin to You and did not hide my iniquity. I said, “I will confess my transgressions to the LORD,” and You forgave the guilt of my sin.'
        - Psalm 103:12
      reflection: >-
        What have you done that you need to bring into the light, before God and, if needed, before the person you wronged?
      prayer: >-
        God, I have done wrong, and I know it. I won't hide it or explain it away. I confess it to You now, and I trust You to forgive and cleanse me as You promised.
      action: >-
        Name what you did, plainly, in prayer. If someone was hurt, decide today on one step to make it right, like an apology or a repair.
      children:
        - name: Remorseful
          slug: remorseful
          description: sorrow over the harm you have caused
          reviewed: false
          god_sees_this:
            - Luke 22:61-62
            - Psalm 51:3
          truth_to_hold:
            - 2 Corinthians 7:10
            - Psalm 51:17
          reflection: >-
            Is your sorrow leading you toward God and toward repair, or only around in circles?
          prayer: >-
            Lord, I am sorry for the harm I caused. Peter wept bitterly, and You restored him. Let this sorrow turn me toward You and toward making things right, not into despair.
          action: >-
            Write down who was hurt and how. Pick one honest step toward repair, like an apology without excuses, and take it this week.
        - name: Condemned
          slug: condemned
          description: feeling judged and sentenced, with no way back
          reviewed: false
          god_sees_this:
            - John 8:10-11
            - Psalm 130:3-4
          truth_to_hold:
            - Romans 8:1
            - Romans 8:33-34
            - 1 John 3:19-20
          reflection: >-
            Whose voice is passing sentence on you: God's, someone else's, or your own?
          prayer: >-
            Jesus, I feel sentenced, with no way back. But You said to the woman, "Neither do I condemn you." Christ is the one who could condemn me, and He is praying for me instead. Help me believe it.
          action: >-
            Read Romans 8:33–34 aloud, slowly. Each time the condemning thought comes back today, answer it with "Christ Jesus is interceding for me."
        - name: Regretful
          slug: regretful
          description: wishing you could undo what you did or didn't do
          reviewed: false
          god_sees_this:
            - Psalm 25:7
            - Luke 22:61-62
          truth_to_hold:
            - Joel 2:25
            - Philippians 3:13-14
            - Lamentations 3:22-23
          reflection: >-
            What do you wish you could undo, and what might God still do with it from here?
          prayer: >-
            Father, I can't go back and change what happened, and I wish I could. You are able to restore what was lost. Help me leave the past with You and take the next step forward.
          action: >-
            Write down the regret. Then write one thing you could do differently from today on, and do it once this week.
    - name: Worthless
      slug: worthless
      description: believing you have no value
      reviewed: false
      crisis: true
      god_sees_this:
        - Psalm 22:6
        - ref: 1 Kings 19:4
          excerpt: '“I have had enough, LORD,” he said. “Take my life, for I am no better than my fathers.”'
      truth_to_hold:
        - Isaiah 43:4
        - Matthew 10:29-31
        - Psalm 139:13-14
      reflection: >-
        Who taught you that you were worthless, and does God agree with them?
      prayer: >-
        God, I feel like I'm worth nothing. Elijah felt it too, and You didn't leave him there. You call me precious and honoured. Hold on to that for me when I can't believe it.
      action: >-
        If feeling worthless has you thinking about hurting yourself, tell someone today: a trusted friend, a pastor, a doctor, or call or text 988. You are worth that phone call.
      children:
        - name: Unlovable
          slug: unlovable
          description: sure that no one could truly love you
          reviewed: false
          god_sees_this:
            - Psalm 88:18
            - Luke 15:20-21
          truth_to_hold:
            - Jeremiah 31:3
            - Romans 5:8
            - Zephaniah 3:17
          reflection: >-
            What do you think someone would find in you that would make them stop loving you, and has God already seen it?
          prayer: >-
            Father, I feel like no one could really love me. The son in the story felt unworthy, and the father ran to him anyway. You loved me before I was any good. Let me feel that love today.
          action: >-
            Read Zephaniah 3:17 and put your own name in it. Then let one person who cares about you close enough to see how you're really doing.
        - name: Like a failure
          slug: like-a-failure
          description: measuring your life and finding it not enough
          reviewed: false
          god_sees_this:
            - ref: 1 Kings 19:4
              excerpt: '“I have had enough, LORD,” he said. “Take my life, for I am no better than my fathers.”'
            - Psalm 73:26
          truth_to_hold:
            - Proverbs 24:16
            - 2 Corinthians 12:9
            - Ephesians 2:10
          reflection: >-
            Whose measuring stick are you using to call yourself a failure?
          prayer: >-
            Lord, I look at my life and it feels like it doesn't add up. Your grace is enough for me, and Your strength shows up in my weakness. Help me get up again, and show me the good work You still have for me.
          action: >-
            Write down three things you have got through or done well, however small. Then choose one small, good thing to do today.
        - name: Insignificant
          slug: insignificant
          description: as if your life makes no difference
          reviewed: false
          god_sees_this:
            - Judges 6:15
            - Psalm 31:12
          truth_to_hold:
            - Matthew 10:29-31
            - 1 Corinthians 1:27-28
            - Psalm 139:13-14
          reflection: >-
            What small faithfulness in your life might matter more than you think?
          prayer: >-
            God, I feel small and like my life makes no difference. Gideon felt the same, and You still chose him. You count the sparrows and the hairs on my head. Show me that I matter to You.
          action: >-
            Do one small kindness for someone today, unseen if you can. Remember that God notices it.
    - name: Inadequate
      slug: inadequate
      description: not measuring up to what is asked of you
      reviewed: false
      god_sees_this:
        - Exodus 4:10
        - Judges 6:15
      truth_to_hold:
        - 2 Corinthians 3:5
        - 2 Corinthians 12:9
      reflection: >-
        What is being asked of you right now, and what would it look like to lean on God's strength for it instead of your own?
      prayer: >-
        Lord, I don't feel up to this. Moses didn't either, and You went with him. My competence comes from You. Give me what I need for today's part.
      action: >-
        Write down the task that feels too big. Break it into the smallest next step, ask God for help with that step, and do it.
      children:
        - name: Not good enough
          slug: not-good-enough
          description: whatever you do, it never seems to be enough
          reviewed: false
          god_sees_this:
            - Romans 7:24-25
            - Luke 15:28-29
          truth_to_hold:
            - Ephesians 2:8-9
            - Luke 15:31
            - 2 Corinthians 12:9
          reflection: >-
            Who are you trying to be good enough for, and what would change if you didn't have to earn it?
          prayer: >-
            Father, I keep trying and it never feels like enough. Like the older son, I've been working hard for love that was already mine. Let me rest in grace I don't have to earn.
          action: >-
            Pick one thing today that you will do "well enough" instead of perfectly. When it's done, stop, and thank God for grace.
        - name: Inferior
          slug: inferior
          description: lesser than the people around you
          reviewed: false
          god_sees_this:
            - Exodus 4:10
            - Psalm 22:6
          truth_to_hold:
            - 1 Samuel 16:7
            - Ephesians 2:10
            - 1 Corinthians 1:27-28
          reflection: >-
            Who are you comparing yourself to, and what does that comparison leave out?
          prayer: >-
            Lord, I keep measuring myself against others and coming up short. You don't look at what they see. You look at the heart. Help me stop comparing and do the work You gave me.
          action: >-
            Notice the next time you compare yourself to someone. Stop, thank God for one thing in them, and one thing He has given you.
        - name: Falling short
          slug: falling-short
          description: missing the mark again and again
          reviewed: false
          god_sees_this:
            - Romans 7:24-25
            - Romans 3:23-24
          truth_to_hold:
            - Proverbs 24:16
            - Lamentations 3:22-23
            - Philippians 1:6
          reflection: >-
            Where do you keep missing the mark, and what is one small way God might be growing you there?
          prayer: >-
            God, I keep falling short, again and again. Thank You that Your mercies are new every morning and that You finish what You start. Help me get up one more time.
          action: >-
            Choose one area where you keep falling short. Ask a trusted friend to pray for you in it, and check in with them next week.
    - name: Embarrassed
      slug: embarrassed
      description: wishing you could hide from others' eyes
      reviewed: false
      god_sees_this:
        - Genesis 3:10
        - ref: Psalm 44:15
          excerpt: 'All day long my disgrace is before me, and shame has covered my face'
      truth_to_hold:
        - Psalm 34:5
        - Isaiah 54:4
      reflection: >-
        How big will this moment look in a month, and how does God see you in it now?
      prayer: >-
        Lord, I want to hide. I feel everyone's eyes on me. You see me and You don't turn away. Help me hold my head up and laugh at myself where I can.
      action: >-
        Tell one safe person what happened. Shame grows in hiding and shrinks when it's shared.
      children:
        - name: Humiliated
          slug: humiliated
          description: shamed in front of others
          reviewed: false
          god_sees_this:
            - Psalm 69:19
            - Isaiah 53:3
          truth_to_hold:
            - Hebrews 12:2
            - Isaiah 61:7
            - Isaiah 50:7
          reflection: >-
            Jesus was shamed in public too. What does it mean that He knows exactly how this feels?
          prayer: >-
            Jesus, I was shamed in front of others, and it burns. You were mocked and despised, and You know this pain. Take my shame, and give me Your dignity back.
          action: >-
            Write down what happened and how it made you feel. Then read Isaiah 61:7 and ask God for His "double portion" in place of this shame.
        - name: Exposed
          slug: exposed
          description: something you wanted hidden has come to light
          reviewed: false
          god_sees_this:
            - Genesis 3:10
            - Psalm 69:5
          truth_to_hold:
            - Hebrews 4:13
            - 1 John 1:9
            - Hebrews 4:15-16
          reflection: >-
            Now that it's in the light, what might God want to heal that couldn't be healed in hiding?
          prayer: >-
            God, what I wanted hidden is out, and I feel naked. You already saw it, and You still invite me to come close. Meet me here, and heal what hiding couldn't.
          action: >-
            If what came out hurt someone, own it honestly with them. If it was something done to you, talk it through with someone you trust.
        - name: Foolish
          slug: foolish
          description: feeling stupid for what you said or did
          reviewed: false
          god_sees_this:
            - Psalm 69:5
            - Matthew 14:31
          truth_to_hold:
            - James 1:5
            - Proverbs 24:16
          reflection: >-
            What can you learn from this, and then let go of?
          prayer: >-
            Lord, I feel stupid for what I said and did. You know my folly, and You don't throw me away. Give me wisdom for next time, and help me let this go.
          action: >-
            Write down one lesson you'll take from this. If you need to apologise, do it simply. Then let it go.
    - name: Unclean
      slug: unclean
      description: feeling stained by sin or by what was done to you
      reviewed: false
      god_sees_this:
        - Isaiah 6:5
        - Mark 1:40-41
      truth_to_hold:
        - Psalm 51:7
        - Ezekiel 36:25-26
        - Isaiah 1:18
      reflection: >-
        Does this stain come from something you did, something done to you, or both, and what would it mean to let Jesus touch it?
      prayer: >-
        Jesus, I feel stained and unclean. You reached out and touched the leper when no one else would. Touch me too. Make me clean, and help me believe it.
      action: >-
        Read Mark 1:40–41 slowly. If this feeling comes from harm someone did to you, it was not your sin. Tell a trusted person or counsellor, and let them help you carry it.
      children:
        - name: Defiled
          slug: defiled
          description: feeling dirty in a way you can't wash off
          reviewed: false
          god_sees_this:
            - ref: 2 Samuel 13:13
              excerpt: 'Where could I ever take my shame?'
            - Mark 5:25-26
          truth_to_hold:
            - Mark 1:40-41
            - Ezekiel 36:25-26
            - Hebrews 10:22
          reflection: >-
            What would it be like to believe that Jesus is not afraid to touch what makes you feel dirty?
          prayer: >-
            Lord, I feel dirty in a way I can't wash off. Tamar cried out, "Where could I take my shame?" and You heard her. Wash me, make me new, and don't let what was done to me define me.
          action: >-
            If someone harmed or abused you, what they did is not your shame. Tell a trusted person, pastor or counsellor this week, and let someone help you carry it.
        - name: Disgusted with myself
          slug: disgusted-with-myself
          description: unable to stand who you have been
          reviewed: false
          god_sees_this:
            - Job 42:6
            - Romans 7:24-25
          truth_to_hold:
            - 1 Timothy 1:15-16
            - Ezekiel 36:25-26
            - 2 Corinthians 7:10
          reflection: >-
            Is your disgust leading you to change, or just to hate yourself?
          prayer: >-
            God, I can't stand who I have been. Paul called himself the worst of sinners, and You showed him mercy. Turn this disgust into real change, and teach me to see myself with Your mercy.
          action: >-
            Write down one thing about who you've been that you want to change. Then write one thing God has done for you anyway. Keep the second where you'll see it.
        - name: Unforgivable
          slug: unforgivable
          description: sure you have gone too far to be forgiven
          reviewed: false
          god_sees_this:
            - Luke 15:20-21
            - Psalm 130:3-4
          truth_to_hold:
            - Isaiah 1:18
            - Micah 7:18-19
            - 1 Timothy 1:15-16
          reflection: >-
            What makes you think your sin is bigger than Christ's cross?
          prayer: >-
            Father, I feel like I've gone too far to be forgiven. But You ran to the son who came home, and You throw our sins into the depths of the sea. I come home to You now. Forgive me.
          action: >-
            Read Micah 7:18–19 aloud. Then tell a pastor or mature Christian what you're carrying, and let them remind you of God's forgiveness.

- name: Loneliness
  slug: loneliness
  description: an ache to be known, wanted and close to someone
  reviewed: false
  god_sees_this:
    - Psalm 25:16
    - Psalm 102:7
  truth_to_hold:
    - Psalm 68:6
    - Deuteronomy 31:8
    - Psalm 73:23
  reflection: >-
    What kind of closeness are you missing most right now: being known, being wanted, or simply having company?
  prayer: >-
    Lord, I feel alone, and it aches. David prayed this same prayer, so I bring it to You too. Be near me, and lead me toward people who can be near me as well.
  action: >-
    Reach out to one person today with a message, a call or an invitation, even if it feels awkward. Loneliness often asks us to make the first move.
  children:
    - name: Isolated
      slug: isolated
      description: cut off from the people around you
      reviewed: false
      god_sees_this:
        - Psalm 142:4
        - Psalm 102:7
      truth_to_hold:
        - Psalm 68:6
        - Ecclesiastes 4:9-10
      reflection: >-
        What has cut you off from others, and what is one small way back in?
      prayer: >-
        Father, I feel cut off, and no one seems to notice. You settle the lonely in families. Open a door back to people, and give me courage to walk through it.
      action: >-
        Find one regular gathering, like a church small group, a class or a club, and go once this month.
      children:
        - name: Alone
          slug: alone
          description: no one is with you in this
          reviewed: false
          god_sees_this:
            - John 16:32
            - 2 Timothy 4:16-17
          truth_to_hold:
            - Deuteronomy 31:8
            - Matthew 28:20
            - Psalm 139:7-8
          reflection: >-
            Jesus was left alone too, yet said "the Father is with Me." What would it mean for that to be true of you right now?
          prayer: >-
            Jesus, I feel completely alone in this. You were deserted too, and You know how it feels. Be with me now, and send someone to stand by me.
          action: >-
            Tell one person what you're facing and ask them to check in on you this week.
        - name: Cut off
          slug: cut-off
          description: separated from community by distance, illness or circumstance
          reviewed: false
          god_sees_this:
            - Psalm 38:11
            - Psalm 88:8
          truth_to_hold:
            - Romans 8:38-39
            - Hebrews 13:5
          reflection: >-
            What connection is still possible from where you are, even if it's small?
          prayer: >-
            Lord, I'm separated from the people I'd normally lean on, and I can't fix that right now. Nothing can separate me from Your love. Be my company, and show me the connection that is still possible.
          action: >-
            Ask one person for a regular call or video chat, even ten minutes a week. If you can't get to church, ask whether someone could visit or pray with you by phone.
        - name: Homesick
          slug: homesick
          description: longing for a place and people you have left
          reviewed: false
          god_sees_this:
            - Psalm 137:1
            - Psalm 137:4
          truth_to_hold:
            - Jeremiah 29:7
            - Hebrews 11:13-16
            - Psalm 84:3
          reflection: >-
            What do you miss most about home, and how might God be planting you where you are now?
          prayer: >-
            Father, I miss home: the places, the people, the way things were. The exiles wept by the rivers of Babylon, and You saw them. Help me grieve what I left, and plant me where I am.
          action: >-
            Call or write to someone from home this week. Then do one thing that helps you put down roots where you are, like learning a neighbour's name or joining a local church.
    - name: Rejected
      slug: rejected
      description: pushed away by people you wanted to be close to
      reviewed: false
      god_sees_this:
        - Isaiah 53:3
        - John 1:11-12
      truth_to_hold:
        - 1 Peter 2:4
        - John 6:37
        - Isaiah 41:9
      reflection: >-
        Jesus was rejected by His own. What does it mean that He knows this from the inside?
      prayer: >-
        Jesus, I've been pushed away, and it hurts. You were despised and rejected too. Thank You that You will never drive me away. Heal this wound, and help me not to close my heart.
      action: >-
        Read John 6:37 and write it somewhere you'll see it. Then spend time this week with someone who has shown you they want you around.
      children:
        - name: Excluded
          slug: excluded
          description: left out while others are welcomed in
          reviewed: false
          god_sees_this:
            - ref: Luke 15:28-29
              excerpt: 'Yet you never gave me even a young goat so I could celebrate with my friends.'
            - Psalm 142:4
          truth_to_hold:
            - Ephesians 2:19
            - Luke 19:5
            - John 6:37
          reflection: >-
            Where have you been left out, and where might you be welcomed in?
          prayer: >-
            Lord, I'm on the outside while others are welcomed in. You noticed Zacchaeus up a tree and invited Yourself to his house. Notice me too, and lead me to people who will make room for me.
          action: >-
            Look for one person who might also be on the edges, and invite them in, whether to coffee, a meal or a conversation.
        - name: Unwanted
          slug: unwanted
          description: as if no one wants you around
          reviewed: false
          god_sees_this:
            - Job 19:19
            - Psalm 31:12
          truth_to_hold:
            - Zephaniah 3:17
            - Ephesians 1:5-6
            - Psalm 27:10
          reflection: >-
            What would change if you believed God was glad you exist?
          prayer: >-
            Father, I feel like no one wants me around. But You chose to adopt me, and You rejoice over me with singing. Help me to feel wanted by You, and open someone's door to me.
          action: >-
            Read Zephaniah 3:17 aloud with your name in it. Then reply to, or reach out to, one person who has been kind to you lately.
        - name: Ignored
          slug: ignored
          description: treated as if you aren't there
          reviewed: false
          god_sees_this:
            - Psalm 142:4
            - Psalm 38:11
          truth_to_hold:
            - Genesis 16:13
            - Psalm 34:15
            - Psalm 56:8
          reflection: >-
            Hagar called God "the One who sees me." Where do you most need to be seen?
          prayer: >-
            God who sees me, I feel invisible to the people around me. You saw Hagar in the desert, and You see me here. Let me feel seen by You, and help others to see me too.
          action: >-
            Tell one person honestly that you've been feeling overlooked. Asking to be noticed is not weakness.
    - name: Abandoned
      slug: abandoned
      description: left by someone who should have stayed
      reviewed: false
      god_sees_this:
        - Psalm 27:10
        - Mark 14:50
      truth_to_hold:
        - Hebrews 13:5
        - Isaiah 49:15-16
        - Psalm 9:10
      reflection: >-
        Who left, and what did their leaving make you believe about yourself?
      prayer: >-
        Lord, someone who should have stayed left me. Even if my father and mother forsake me, You will receive me. Hold me close, and heal what this leaving broke.
      action: >-
        Write down what their leaving made you believe about yourself. Then write Hebrews 13:5 beside it, and talk to someone you trust about the hurt.
      children:
        - name: Deserted
          slug: deserted
          description: left to face hard things on your own
          reviewed: false
          god_sees_this:
            - ref: 2 Timothy 4:16
              excerpt: 'At my first defense, no one stood with me, but everyone deserted me.'
            - Mark 14:50
          truth_to_hold:
            - ref: 2 Timothy 4:17
              excerpt: 'But the Lord stood by me and strengthened me'
            - Deuteronomy 31:8
          reflection: >-
            Paul was deserted at his trial, yet said, "the Lord stood by me." Where do you need the Lord to stand by you now?
          prayer: >-
            Lord, I've been left to face this on my own. Paul knew this too, and You stood by him. Stand by me and strengthen me today.
          action: >-
            Name the hard thing you're facing alone. Ask one person, even someone new, to help with one practical part of it.
        - name: Forgotten
          slug: forgotten
          description: as if no one remembers you exist
          reviewed: false
          god_sees_this:
            - Isaiah 49:14
            - Psalm 31:12
          truth_to_hold:
            - Isaiah 49:15-16
            - Psalm 56:8
            - Luke 15:4
          reflection: >-
            God says He has written your name on His hands. How does that sit next to feeling forgotten?
          prayer: >-
            God, I feel forgotten, as if no one remembers I exist. Zion said the same, and You answered, "I will not forget you." Remind me that I'm written on Your hands.
          action: >-
            Write Isaiah 49:16 on your hand or on a note. Then reach out to one person you've lost touch with.
        - name: Left behind
          slug: left-behind
          description: everyone else has moved on without you
          reviewed: false
          god_sees_this:
            - Job 19:13-14
            - Psalm 88:18
          truth_to_hold:
            - Luke 15:4
            - Psalm 73:23
            - Isaiah 41:9
          reflection: >-
            Whose timeline are you measuring yourself against?
          prayer: >-
            Lord, everyone seems to have moved on without me. The Shepherd goes after the one who is left behind. Find me here, and walk with me at the pace You set for me.
          action: >-
            Write down what you feel left behind in. Then name one good thing in your own life right now, and thank God for it.
    - name: Misunderstood
      slug: misunderstood
      description: no one seems to see what's really going on inside you
      reviewed: false
      god_sees_this:
        - 1 Samuel 1:13
        - ref: Psalm 42:3
          excerpt: 'My tears have been my food both day and night'
      truth_to_hold:
        - ref: Psalm 139:1
          excerpt: 'O LORD, You have searched me and known me.'
        - Psalm 139:2-3
        - 1 Samuel 16:7
      reflection: >-
        What do you wish someone understood about you right now?
      prayer: >-
        Lord, no one seems to see what's going on inside me. You have searched me and You know me completely. Help me rest in being known by You, and give me words to help others understand.
      action: >-
        Write down what you wish someone understood. Then share it with one person you trust, plainly and kindly.
      children:
        - name: Unseen
          slug: unseen
          description: your pain or effort goes unnoticed
          reviewed: false
          god_sees_this:
            - Psalm 142:4
            - Psalm 69:19
          truth_to_hold:
            - Genesis 16:13
            - Psalm 56:8
            - Galatians 6:9
          reflection: >-
            What effort or pain of yours has gone unnoticed, and what does it mean that God keeps count of your tears?
          prayer: >-
            God who sees me, no one seems to notice what I'm carrying. You keep every tear in Your bottle. Let that be enough today, and help me keep going.
          action: >-
            Tell God, in writing, everything you've done or carried that no one noticed. Then tell one person about one part of it.
        - name: Unheard
          slug: unheard
          description: you speak, but no one really listens
          reviewed: false
          god_sees_this:
            - 1 Samuel 1:14-15
            - Psalm 142:4
          truth_to_hold:
            - Psalm 116:1-2
            - Psalm 4:3
            - Psalm 34:15
          reflection: >-
            Hannah was misheard by the priest but heard by God. What do you need God to hear today?
          prayer: >-
            Lord, I speak and no one really listens. Hannah poured out her soul to You when even the priest misunderstood her. I'm pouring out mine. Hear me.
          action: >-
            Pour out everything to God, aloud or in writing. Then ask one person, "Could I talk to you about something? I just need you to listen."
        - name: Judged
          slug: judged
          description: others have made up their minds about you
          reviewed: false
          god_sees_this:
            - Psalm 35:11
            - 1 Samuel 1:14-15
          truth_to_hold:
            - 1 Corinthians 4:3-4
            - 1 Samuel 16:7
            - Romans 8:33-34
          reflection: >-
            Whose verdict about you matters most, and what does God say?
          prayer: >-
            Father, people have made up their minds about me, and it hurts. You see the heart, and You are my judge, not them. Help me hold their opinions loosely and listen to You.
          action: >-
            If there's truth in what they think, own that part. Let the rest go, and read 1 Corinthians 4:3–4 when the judgement comes to mind.
    - name: Disconnected
      slug: disconnected
      description: among people but not really with them
      reviewed: false
      god_sees_this:
        - Psalm 55:12-14
        - Psalm 88:18
      truth_to_hold:
        - Romans 12:15
        - Hebrews 10:24-25
        - Revelation 3:20
      reflection: >-
        What keeps you from really being with the people you're among?
      prayer: >-
        Lord, I'm around people, but I don't feel with them. You knock and wait to share a meal with me. Teach me to open up to You and to others, one step at a time.
      action: >-
        In your next conversation, share one true thing about how you're doing, beyond "fine."
      children:
        - name: Distant
          slug: distant
          description: close relationships have grown cold
          reviewed: false
          god_sees_this:
            - Psalm 55:12-14
            - Job 19:13-14
          truth_to_hold:
            - Ecclesiastes 4:9-10
            - Galatians 6:2
          reflection: >-
            Which relationship has grown cold, and what is one warm step you could take toward it?
          prayer: >-
            Father, people I was close to feel far away now. Show me what happened, and whether there's something for me to mend. Warm what has grown cold.
          action: >-
            Choose one relationship that has cooled. Send a message today that says, simply, "I've been thinking about you."
        - name: Out of place
          slug: out-of-place
          description: like you don't belong where you are
          reviewed: false
          god_sees_this:
            - Psalm 119:19
            - Ruth 2:10
          truth_to_hold:
            - Ephesians 2:19
            - 1 Peter 2:9-10
            - Philippians 3:20
          reflection: >-
            Ruth was a foreigner who found a home. Where might God be making room for you?
          prayer: >-
            Lord, I feel like I don't belong here. Ruth felt like a foreigner too, and You made her part of Your family. Remind me that I belong to Your household, and show me where I fit.
          action: >-
            Find one person in this place who seems to welcome you, and spend a little more time with them this week.

- name: Weariness
  slug: weariness
  description: worn down in body, mind or soul
  reviewed: false
  god_sees_this:
    - Psalm 6:6
    - Psalm 143:4
  truth_to_hold:
    - Matthew 11:28-29
    - Isaiah 40:29-31
  reflection: >-
    Is your tiredness mostly in your body, your mind or your soul, and what kind of rest would actually help?
  prayer: >-
    Jesus, I'm worn down. You invite the weary to come to You, so I'm coming. I don't have much to bring. Give me rest, and renew my strength.
  action: >-
    Choose one thing you can set down today, like a task, a commitment or a late night, and use that time to rest.
  children:
    - name: Exhausted
      slug: exhausted
      description: completely out of strength
      reviewed: false
      god_sees_this:
        - 1 Kings 19:5-7
        - Psalm 69:3
      truth_to_hold:
        - Isaiah 40:29-31
        - Psalm 73:26
      reflection: >-
        When God met an exhausted Elijah, He gave him sleep and food first. What does your body need first?
      prayer: >-
        Lord, I'm completely out of strength. You met Elijah under the broom tree with sleep and bread before anything else. Care for me like that, and give power to my weakness.
      action: >-
        Do what the angel told Elijah: eat something nourishing and sleep. Leave the hard conversations and decisions until you've rested.
      children:
        - name: Drained
          slug: drained
          description: everything has been poured out and nothing refilled
          reviewed: false
          god_sees_this:
            - ref: Psalm 22:14
              excerpt: 'I am poured out like water'
            - Psalm 143:4
          truth_to_hold:
            - Isaiah 58:11
            - Psalm 23:2-3
          reflection: >-
            What has been draining you, and what actually refills you?
          prayer: >-
            Lord, I'm poured out and empty. You lead me beside quiet waters and restore my soul. Fill me again, and show me how to stop pouring from an empty cup.
          action: >-
            Make two lists: what drains you and what refills you. Do one thing from the second list today.
        - name: Burned out
          slug: burned-out
          description: worn out by work or service that once gave you life
          reviewed: false
          god_sees_this:
            - Exodus 18:17-18
            - Numbers 11:14
          truth_to_hold:
            - Mark 6:31
            - Psalm 127:2
            - Galatians 6:9
          reflection: >-
            Jethro told Moses, "You cannot handle it alone." What are you carrying alone that you need to share or set down?
          prayer: >-
            Father, the work that once gave me life has worn me out. Moses couldn't carry it alone either. Show me what to hand to others, what to set down, and how to rest with You.
          action: >-
            Name one responsibility you could hand to someone else or pause for a season. Have that conversation this week. If burnout has lasted months, talk to a doctor too.
        - name: Sleepless
          slug: sleepless
          description: unable to rest even when you lie down
          reviewed: false
          god_sees_this:
            - Psalm 77:4
            - Job 7:3-4
          truth_to_hold:
            - Psalm 4:8
            - Psalm 3:5
            - Psalm 127:2
          reflection: >-
            What thoughts keep you awake, and could you hand them to God before you lie down?
          prayer: >-
            Lord, I lie awake and the night drags on. You give sleep to those You love. Quiet my mind, take my worries, and let me lie down in peace.
          action: >-
            Before bed, write down what's on your mind and leave it on the page. Read Psalm 4:8 as you lie down. If sleeplessness keeps going, see a doctor.
    - name: Burdened
      slug: burdened
      description: carrying more weight than you were made to carry
      reviewed: false
      god_sees_this:
        - Numbers 11:14
        - Psalm 38:4
      truth_to_hold:
        - Psalm 55:22
        - Matthew 11:28-29
        - 1 Peter 5:7
      reflection: >-
        What are you carrying that God never asked you to carry alone?
      prayer: >-
        Lord, this weight is too much for me. You tell me to cast my burden on You, so I'm handing it over. Carry what I can't, and show me who can help with the rest.
      action: >-
        Write down everything you're carrying. Circle one thing to give to God in prayer, and one thing to ask someone else to help with.
      children:
        - name: Weighed down
          slug: weighed-down
          description: responsibilities pressing on you all day
          reviewed: false
          god_sees_this:
            - 2 Corinthians 11:28
            - Exodus 18:17-18
          truth_to_hold:
            - Psalm 55:22
            - Exodus 33:14
          reflection: >-
            Which of your responsibilities are truly yours, and which have you picked up that belong to someone else?
          prayer: >-
            Father, my responsibilities press on me all day long. Your presence goes with me, and You promise rest. Help me carry what is mine and put down what isn't.
          action: >-
            Look at tomorrow's list. Cross off or postpone one thing that doesn't truly need you.
        - name: Stretched thin
          slug: stretched-thin
          description: too many people need too much from you
          reviewed: false
          god_sees_this:
            - Mark 6:31
            - Numbers 11:14
          truth_to_hold:
            - Luke 10:41-42
            - Exodus 18:17-18
          reflection: >-
            Jesus left crowds to rest. Who might you need to say "not now" to, so you can say "yes" to what matters?
          prayer: >-
            Lord, everyone needs something from me, and I'm stretched too thin. Jesus took His friends away to rest even when people kept coming. Give me the courage to say no, and to rest without guilt.
          action: >-
            Say one kind "no" or "not this week" today. Use the time it frees up to rest or pray.
        - name: Carrying others' pain
          slug: carrying-others-pain
          description: worn by caring for someone who is suffering
          reviewed: false
          god_sees_this:
            - 2 Corinthians 11:28
            - Psalm 6:6
          truth_to_hold:
            - Galatians 6:2
            - Galatians 6:9
            - 1 Peter 5:7
          reflection: >-
            Who is caring for you while you care for someone else?
          prayer: >-
            Father, caring for someone I love is wearing me down. You see what I give and what it costs. Strengthen me, and send someone to care for me too.
          action: >-
            Ask one person to take over a caring task for a few hours this week, and use that time to rest. Look for a carers' support group or a church member who can help.
    - name: Worn down
      slug: worn-down
      description: tired from a struggle that has lasted too long
      reviewed: false
      god_sees_this:
        - Psalm 6:3
        - Psalm 69:3
      truth_to_hold:
        - Hebrews 12:3
        - 2 Corinthians 4:16-17
        - Galatians 6:9
      reflection: >-
        What has kept you going this long, and what do you need to keep going a little longer?
      prayer: >-
        Lord, this struggle has lasted too long, and I'm worn down. Jesus endured, and He knows what it costs. Renew me inwardly day by day, and help me not to lose heart.
      action: >-
        Write down one way God has carried you through this so far. Then ask someone to pray for you this week.
      children:
        - name: Tired of waiting
          slug: tired-of-waiting
          description: you have waited and prayed, and still nothing
          reviewed: false
          god_sees_this:
            - Psalm 6:3
            - Psalm 69:3
          truth_to_hold:
            - ref: Psalm 40:1
              excerpt: 'I waited patiently for the LORD; He inclined to me and heard my cry.'
            - Isaiah 40:31
            - Lamentations 3:25-26
          reflection: >-
            What have you been praying for, and what would it mean to keep bringing it to God even now?
          prayer: >-
            Lord, I've waited and prayed, and still nothing. How long? I don't understand the delay. Keep me from giving up on You, and renew my strength while I wait.
          action: >-
            Write down what you're waiting for and the date. Keep praying about it, and also do one good thing today that doesn't depend on the answer.
        - name: Worn out by pain
          slug: worn-out-by-pain
          description: long illness or ongoing pain has taken its toll
          reviewed: false
          god_sees_this:
            - Mark 5:25-26
            - Psalm 38:8
          truth_to_hold:
            - 2 Corinthians 4:16-17
            - Revelation 21:4
            - Romans 8:18
          reflection: >-
            How has this pain changed you, and where have you seen God in it, even faintly?
          prayer: >-
            Lord, this pain has gone on so long, and it's taken so much out of me. The woman who bled for twelve years knew this too, and she reached for You. I'm reaching for You now. Give me strength for today, and hope for the day when pain is gone.
          action: >-
            Rest without guilt today. If you haven't recently, talk to your doctor about your pain and your mood, since long pain often weighs on both.
        - name: Ready to give up
          slug: ready-to-give-up
          description: you don't know how much longer you can keep going
          reviewed: false
          crisis: true
          god_sees_this:
            - Job 6:11
            - ref: 1 Kings 19:4
              excerpt: '“I have had enough, LORD,” he said.'
          truth_to_hold:
            - 1 Kings 19:5-7
            - 2 Corinthians 4:8-9
            - Isaiah 42:3
          reflection: >-
            When Elijah said "I have had enough," God sent rest and food, not a lecture. What do you need most right now?
          prayer: >-
            Lord, I don't know how much longer I can keep going. Elijah told You he'd had enough, and You cared for him. You won't break a bruised reed. Hold me up, and send me help today.
          action: >-
            If giving up means you're thinking of ending your life, call or text 988 now, or tell someone you trust today. You don't have to keep going alone.
    - name: Numb
      slug: numb
      description: feeling very little at all
      reviewed: false
      god_sees_this:
        - Psalm 38:8
        - Psalm 143:4
      truth_to_hold:
        - Ezekiel 36:26
        - Isaiah 42:3
      reflection: >-
        When did you stop feeling much, and what was happening then?
      prayer: >-
        Lord, I don't feel much of anything. I don't even know what to pray. You won't put out a smouldering wick. Keep the small flame in me alive, and bring feeling back in Your time.
      action: >-
        Do one simple, physical thing today, like a walk outside, a warm shower or a meal with someone. If numbness has lasted weeks, talk to a doctor or counsellor.
      children:
        - name: Detached
          slug: detached
          description: watching your own life from a distance
          reviewed: false
          god_sees_this:
            - Psalm 143:4
            - Psalm 77:4
          truth_to_hold:
            - Psalm 139:7-8
            - Psalm 73:23
          reflection: >-
            What might you be protecting yourself from by stepping back?
          prayer: >-
            Lord, I feel like I'm watching my life from far away. Wherever I go, You are there. Hold my hand, and bring me gently back into my own life.
          action: >-
            Ground yourself: name five things you can see and three you can hear, and say "God is here" for each. If this feeling is frequent, talk to a doctor or counsellor.
        - name: Apathetic
          slug: apathetic
          description: finding it hard to care about anything
          reviewed: false
          god_sees_this:
            - Ecclesiastes 2:17
            - Ecclesiastes 1:14
          truth_to_hold:
            - Psalm 51:12
            - Romans 15:13
          reflection: >-
            What did you used to care about, and what changed?
          prayer: >-
            God, I can't make myself care about much right now. Even the Teacher in Ecclesiastes felt everything was futile. Restore the joy I've lost, and give me a willing spirit.
          action: >-
            Pick one small thing you once enjoyed and do it for ten minutes, even without feeling like it. Tell someone if this has lasted a while.
        - name: Flat
          slug: flat
          description: no highs or lows, just grey
          reviewed: false
          god_sees_this:
            - Lamentations 3:17-18
            - Psalm 143:4
          truth_to_hold:
            - Lamentations 3:22-23
            - Hosea 6:3
          reflection: >-
            Where might there still be a small colour in your grey day?
          prayer: >-
            Lord, everything feels grey. I've almost forgotten what good feels like. Your mercies are new every morning, even on grey ones. Come to me like the spring rain.
          action: >-
            At the end of today, write down one small good thing, however ordinary. Do the same tomorrow, and keep going for a week.
    - name: Spiritually dry
      slug: spiritually-dry
      description: your soul feels parched and far from refreshment
      reviewed: false
      god_sees_this:
        - ref: Psalm 63:1
          excerpt: 'O God, You are my God. Earnestly I seek You; my soul thirsts for You. My body yearns for You in a dry and weary land without water.'
        - ref: Psalm 143:6
          excerpt: 'I stretch out my hands to You; my soul thirsts for You like a parched land.'
      truth_to_hold:
        - Isaiah 44:3
        - Isaiah 58:11
        - Jeremiah 17:7-8
      reflection: >-
        What might your dryness be telling you about what your soul needs?
      prayer: >-
        God, my soul feels parched. I'm going through a dry and weary land. You promise to pour water on the thirsty. I'm thirsty. Please come.
      action: >-
        Try a different way of meeting God this week, like praying on a walk, reading a psalm aloud, or sitting in silence for five minutes.
      children:
        - name: Going through the motions
          slug: going-through-the-motions
          description: doing the right things with no life in them
          reviewed: false
          god_sees_this:
            - Isaiah 29:13
            - Revelation 2:4
          truth_to_hold:
            - Psalm 51:12
            - Revelation 3:20
          reflection: >-
            What would you say to God if you dropped the routine and just told Him how it really is?
          prayer: >-
            Lord, I'm doing the right things, but my heart isn't in them. I'd rather be honest with You than just keep going through the motions. Restore the joy of my salvation.
          action: >-
            Skip your usual routine once this week. Instead, tell God honestly how it is, in your own words, with no script.
        - name: Struggling to pray
          slug: struggling-to-pray
          description: prayer feels hard, empty or impossible
          reviewed: false
          god_sees_this:
            - Psalm 77:4
            - Luke 11:1
          truth_to_hold:
            - Romans 8:26
            - Matthew 6:7-8
          reflection: >-
            What if prayer today was just a few honest words, or even silence?
          prayer: >-
            Lord, I don't know how to pray right now. The words won't come. Your Spirit prays for me with groans too deep for words. Let that be enough today.
          action: >-
            Pray one short sentence, like "Lord, help me" or "I'm here," several times today. Or pray the Lord's Prayer slowly.
        - name: Thirsty for God
          slug: thirsty-for-god
          description: longing for God's presence you can't seem to feel
          reviewed: false
          god_sees_this:
            - ref: Psalm 42:2
              excerpt: 'My soul thirsts for God, the living God. When shall I come and appear in God’s presence?'
            - Psalm 84:2
          truth_to_hold:
            - John 7:37
            - Isaiah 55:1
            - John 4:13-14
          reflection: >-
            Could your thirst itself be a sign that God is drawing you?
          prayer: >-
            Living God, my soul thirsts for You, and I can't seem to feel You near. Jesus said, "If anyone is thirsty, let him come to Me and drink." I'm coming. Satisfy me.
          action: >-
            Read John 7:37 and Psalm 42 slowly. Then sit quietly for five minutes and tell God you're thirsty.

- name: Doubt
  slug: doubt
  description: struggling to trust what you once believed or felt sure of
  reviewed: false
  god_sees_this:
    - Mark 9:24
    - Matthew 11:3
  truth_to_hold:
    - Jude 1:22
    - John 20:27-29
    - 2 Timothy 2:13
  reflection: >-
    What exactly do you doubt right now, and what do you still hold on to, even a little?
  prayer: >-
    Lord, I believe, but help my unbelief. Jesus, You didn't push Thomas away. You showed him Your hands. Meet me in my doubt, and stay faithful when I can't.
  action: >-
    Write down your doubt as one honest question. Bring it to God in prayer, and talk it through with a mature Christian you trust.
  children:
    - name: Confused
      slug: confused
      description: unable to make sense of what is happening
      reviewed: false
      god_sees_this:
        - Psalm 73:16-17
        - Habakkuk 1:3
      truth_to_hold:
        - Proverbs 3:5-6
        - John 13:7
      reflection: >-
        What part of this can you understand, and what might you need to leave with God for now?
      prayer: >-
        Lord, I can't make sense of what's happening. The psalmist couldn't either, until he came into Your presence. I don't need every answer, but I need You. Steady me.
      action: >-
        Write down what you understand and what you don't. Hand the second list to God in prayer, and act on what you do know.
      children:
        - name: Lost
          slug: lost
          description: not knowing which way to go
          reviewed: false
          god_sees_this:
            - Job 23:8-10
            - Isaiah 53:6
          truth_to_hold:
            - Luke 15:4
            - Psalm 32:8
            - Psalm 119:105
          reflection: >-
            If you can't see the whole path, what is the next step right in front of you?
          prayer: >-
            Shepherd, I don't know which way to go. You go after the sheep that's lost. Find me, and light the next step in front of me.
          action: >-
            Don't try to map the whole way. Name the next faithful step, take it today, and ask God to light the one after.
        - name: Torn
          slug: torn
          description: pulled between two paths or two loyalties
          reviewed: false
          god_sees_this:
            - Genesis 32:24-26
            - Romans 7:19
          truth_to_hold:
            - James 1:5
            - Proverbs 3:5-6
            - Isaiah 30:21
          reflection: >-
            What does each path ask you to love most?
          prayer: >-
            Father, I'm pulled two ways, and I don't know which is right. You give wisdom generously to all who ask. I'm asking. Show me the way, and give me peace to walk in it.
          action: >-
            Write down both options. Under each, list what it would cost and what it would honour. Pray over the list, and ask one wise person what they see.
        - name: Unsure of God's will
          slug: unsure-of-gods-will
          description: wanting to obey but not knowing what God wants
          reviewed: false
          god_sees_this:
            - Psalm 25:4-5
            - Job 23:3
          truth_to_hold:
            - Micah 6:8
            - Romans 12:2
            - Proverbs 16:9
          reflection: >-
            What do you already know God wants of you, today, whatever you decide?
          prayer: >-
            Lord, I want to obey You, but I don't know what You want. You've shown me what is good: to act justly, love mercy and walk humbly with You. Help me do that today, and guide my steps.
          action: >-
            Do the parts of God's will you already know: act justly, love mercy, walk humbly. Then make the best choice you can, and trust Him to steer.
    - name: Far from God
      slug: far-from-god
      description: God feels distant or absent
      reviewed: false
      god_sees_this:
        - Psalm 10:1
        - Job 23:8-10
      truth_to_hold:
        - Psalm 139:7-8
        - James 4:8
        - Romans 8:38-39
      reflection: >-
        When did God last feel near, and what has changed since then?
      prayer: >-
        God, You feel far away. Why do You stand far off? I can't feel You, but I'm still here, still calling. Draw near to me as I draw near to You.
      action: >-
        Read Psalm 139:7–10 slowly. Then spend five minutes telling God honestly how far away He feels.
      children:
        - name: Forsaken
          slug: forsaken
          description: as if God Himself has turned away from you
          reviewed: false
          god_sees_this:
            - Matthew 27:46
            - Isaiah 49:14
          truth_to_hold:
            - Psalm 22:24
            - Isaiah 49:15-16
            - Hebrews 13:5
          reflection: >-
            Jesus cried, "Why have You forsaken Me?" What does it mean that He has been where you are?
          prayer: >-
            My God, why have You forsaken me? Jesus prayed these words on the cross, so I can pray them too. You haven't despised my cry. Don't hide Your face from me.
          action: >-
            Pray Psalm 22 aloud. It begins with "My God, my God, why?" and ends with God hearing. Let it carry your words.
        - name: God feels silent
          slug: god-feels-silent
          description: you pray and hear nothing back
          reviewed: false
          god_sees_this:
            - Psalm 22:2
            - Habakkuk 1:2
          truth_to_hold:
            - Micah 7:7
            - Isaiah 59:1
          reflection: >-
            What would you say to God if you knew He was listening, even in His silence?
          prayer: >-
            Lord, I pray and hear nothing. Habakkuk asked "How long?" and so do I. I'll keep watching and waiting for You. Your ear is not too dull to hear me.
          action: >-
            Keep a simple prayer journal this month. Write your prayers and leave space beside each one to note anything God does.
        - name: Cold in faith
          slug: cold-in-faith
          description: your love for God has cooled
          reviewed: false
          god_sees_this:
            - Revelation 2:4
            - Luke 24:32
          truth_to_hold:
            - Hosea 14:4
            - Jeremiah 2:2
            - Psalm 85:6
          reflection: >-
            What first warmed your heart toward God, and could you return there?
          prayer: >-
            Lord, my love for You has cooled. I remember when my heart burned. You remember it too. Revive me again, and bring me back to my first love.
          action: >-
            Do one thing you did when faith was warm, like reading a favourite passage, singing a song you loved, or meeting with an old friend in faith.
    - name: Questioning
      slug: questioning
      description: wrestling with hard questions about God and faith
      reviewed: false
      god_sees_this:
        - Genesis 32:24-26
        - Habakkuk 1:3
      truth_to_hold:
        - James 1:5
        - Deuteronomy 29:29
        - 1 Corinthians 13:12
      reflection: >-
        Jacob wrestled with God and wouldn't let go. What would it look like to wrestle with your questions while holding on?
      prayer: >-
        Lord, I have hard questions about You and about faith. Jacob wrestled with You and wouldn't let go, and You blessed him. I'm holding on. Meet me in my questions.
      action: >-
        Write your hardest question down. Look for one trustworthy book or person who has wrestled with it, and take the question to them.
      children:
        - name: Struggling to believe
          slug: struggling-to-believe
          description: wanting to believe but finding it hard
          reviewed: false
          god_sees_this:
            - Mark 9:24
            - John 20:25
          truth_to_hold:
            - John 20:27-29
            - Luke 24:38-39
            - Jude 1:22
          reflection: >-
            What makes it hard to believe, and what do you still want to be true?
          prayer: >-
            Lord, I want to believe, but it's hard. Help my unbelief. You met Thomas where he was. Meet me here too.
          action: >-
            Read John 20:24–29 slowly. Then pray Mark 9:24, "I do believe; help my unbelief!", as your own prayer each day this week.
        - name: Shaken
          slug: shaken
          description: something has rattled the foundations of your faith
          reviewed: false
          god_sees_this:
            - Psalm 11:3
            - Psalm 73:2-3
          truth_to_hold:
            - Hebrews 12:27-28
            - Isaiah 28:16
            - Matthew 7:24-25
          reflection: >-
            What was shaken, and what is still standing?
          prayer: >-
            Lord, something has shaken the ground under my faith. Show me what was built on sand and what is built on You. Hold me fast while things are shaken.
          action: >-
            Make two lists: what was shaken, and what you still believe. Share both with someone wise you trust.
        - name: Why, God?
          slug: why-god
          description: unable to understand why God allowed this
          reviewed: false
          god_sees_this:
            - Habakkuk 1:3
            - Jeremiah 15:18
          truth_to_hold:
            - Isaiah 55:8-9
            - Romans 8:28
            - Habakkuk 3:17-18
          reflection: >-
            Can you bring your "why" to God without needing an answer today?
          prayer: >-
            God, why did You allow this? I don't understand, and I won't pretend to. Habakkuk asked You why, and You answered him. Help me trust You even without an answer.
          action: >-
            Write your "why" to God as a letter, holding nothing back. Then read Habakkuk 3:17–18, and pray it if you can.
    - name: Disillusioned
      slug: disillusioned
      description: let down by the church or by other believers
      reviewed: false
      god_sees_this:
        - Psalm 55:12-14
        - Micah 7:5
      truth_to_hold:
        - Ezekiel 34:11
        - Matthew 12:20
      reflection: >-
        Can you separate what people did from who God is?
      prayer: >-
        Lord, the people I trusted to show me You have let me down. You see what they did, and You care for Your sheep. Help me not to confuse them with You.
      action: >-
        Write down what happened and what it did to your view of God. Talk it through with someone outside the situation whom you trust.
      children:
        - name: Hurt by church
          slug: hurt-by-church
          description: wounded by a church or by Christians you trusted
          reviewed: false
          god_sees_this:
            - Psalm 55:20-21
            - Ezekiel 34:4
          truth_to_hold:
            - Ezekiel 34:15-16
            - Jeremiah 23:1
            - Matthew 12:20
          reflection: >-
            God was angry with shepherds who hurt His sheep. What does that say about how He sees what happened to you?
          prayer: >-
            Lord, I was hurt by people who claimed to speak for You. You promised to judge the shepherds who harm Your flock and to care for the wounded Yourself. Bind up what was broken in me.
          action: >-
            If what happened was abuse, it is not your fault. Tell someone you trust outside that church. When you're ready, look for a safe, healthy community to heal in, without rushing.
        - name: Cynical
          slug: cynical
          description: expecting the worst from people who claim faith
          reviewed: false
          god_sees_this:
            - Psalm 116:11
            - Matthew 23:27
          truth_to_hold:
            - 1 Corinthians 13:7
            - Philippians 1:6
          reflection: >-
            What hurt taught you to expect the worst, and is there any believer who has proved you wrong?
          prayer: >-
            Lord, I've come to expect the worst from Christians. Some of that came from real hurt. Heal what made me cynical, and help me see the people who are genuine too.
          action: >-
            Think of one believer who has been genuine with you. Thank them this week.
    - name: Spiritually unsure
      slug: spiritually-unsure
      description: uncertain where you stand with God
      reviewed: false
      god_sees_this:
        - Psalm 51:11
        - ref: Psalm 77:9
          excerpt: 'Has God forgotten to be gracious? Has His anger shut off His compassion?'
      truth_to_hold:
        - 1 John 5:13
        - John 10:28-29
        - 1 John 3:19-20
      reflection: >-
        Are you looking to your feelings to tell you where you stand, or to what God has promised?
      prayer: >-
        Lord, I don't know where I stand with You. My heart condemns me, but You are greater than my heart. Help me rest on Your promises, not on how I feel.
      action: >-
        Read 1 John 5:11–13. Talk with a pastor or mature Christian about what assurance means.
      children:
        - name: Unsure I'm saved
          slug: unsure-im-saved
          description: afraid you might not truly belong to God
          reviewed: false
          god_sees_this:
            - Psalm 51:11
            - Mark 9:24
          truth_to_hold:
            - Romans 10:9
            - Ephesians 2:8-9
            - Romans 8:15-16
          reflection: >-
            Is your salvation resting on how strong your faith feels, or on how strong Christ is?
          prayer: >-
            Jesus, I'm afraid I might not truly belong to You. I trust You, even if my faith feels weak. Let Your Spirit assure me that I'm Your child.
          action: >-
            Read Romans 10:9 and Ephesians 2:8–9. Pray them back to God in your own words. Then talk with a pastor about your fears.
        - name: Afraid I've gone too far
          slug: gone-too-far
          description: wondering if you've wandered beyond God's reach
          reviewed: false
          god_sees_this:
            - Jonah 2:4
            - Luke 15:20-21
          truth_to_hold:
            - Isaiah 59:1
            - Hebrews 7:25
            - Isaiah 44:22
          reflection: >-
            Jonah ran as far as he could, and God reached him in the depths. Where do you think you've wandered?
          prayer: >-
            Father, I'm afraid I've wandered too far. Jonah thought he was banished, and You heard him from the depths. Your arm is not too short to save. I'm turning back to You now.
          action: >-
            Read Luke 15:11–24, the story of the son who came home. Then take one step back toward God today, like a prayer, a church visit or a call to a Christian friend.
