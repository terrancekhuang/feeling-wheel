# Feeling Wheel — emotion tree (AI draft for review).
#
# How this file works:
#   - Top level = core ring. "children" = middle ring. Their "children" = specific ring.
#   - slug     = the emotion's link (feelingwheel.app/anxious). Lowercase, hyphens, unique.
#   - reviewed = set to true only after you have read and approved the entry.
#   - crisis   = true shows the crisis banner (988 + helplines) on that emotion's page.
#                Crisis flags below are suggestions — please check each one.
#
# Each emotion's page content (all optional while drafting; all required once reviewed: true):
#   god_sees_this: 2–4 verses of lament and company — someone in Scripture who felt this.
#   truth_to_hold: 2–4 verses of promise or reframe.
#   reflection / prayer / action: one question, a 2–4 sentence prayer, one practical step.
#
# Verses: write just the reference — the exact BSB text is filled in for you.
#     - Psalm 42:5
#     - Mark 14:33-34          (ranges up to 4 verses, same chapter)
#     - ref: Psalm 62:1        (quote only part of a verse; must be word-for-word BSB)
#       excerpt: 'In God alone my soul finds rest; my salvation comes from Him.'
#
# Run `pnpm check` for a report. `pnpm dev` shows drafts; `pnpm build` ships reviewed entries only.
#
# Order matters: emotions appear around the wheel in the order written here.

- name: Fear
  slug: fear
  description: a sense that something bad is coming and you can't stop it
  reviewed: true
  god_sees_this:
    - Psalm 55:4
    - Psalm 102:2
  truth_to_hold:
    - Isaiah 41:10
    - Psalm 23:4
  reflection: >-
    What, specifically, are you afraid might happen, and what would it mean to bring that exact fear to God?
  prayer: >-
    Lord, I'm afraid, and I don't want to pretend otherwise. You see what I'm facing more clearly than I do. Stay near me and steady my heart, one step at a time.
  action: >-
    Write your fear down in one honest sentence. Then read Isaiah 41:10 aloud, slowly, over it.
  children:
    - name: Worried
      slug: worried
      description: a mind that keeps circling what might go wrong
      reviewed: true
      god_sees_this:
        - Psalm 13:2
        - Luke 10:41
      truth_to_hold:
        - Matthew 6:34
        - Psalm 94:19
      reflection: >-
        Which of your worries are about today, and which are about a tomorrow that hasn't arrived?
      prayer: >-
        Father, my mind keeps circling the same worries. I hand You the ones I cannot solve today. Give me what I need for this day, and help me leave tomorrow with You.
      action: >-
        List what you're worried about. Circle the one thing you can act on today, do it, and pray over the rest.
      children:
        - name: Anxious
          slug: anxious
          description: a restless dread about what might happen
          reviewed: true
          god_sees_this:
            - Mark 14:33-34
            - ref: Psalm 42:5
              excerpt: 'Why are you downcast, O my soul? Why the unease within me?'
          truth_to_hold:
            - Philippians 4:6-7
            - 1 Peter 5:7
          reflection: >-
            Where do you feel the anxiety in your body right now, and what might it be trying to tell you?
          prayer: >-
            Jesus, You know what it is to be deeply troubled. I bring You this restless dread just as it is. Guard my heart and mind with Your peace, even before anything changes.
          action: >-
            Take five slow breaths. With each one, name one specific request to God. Finish with one thing you're thankful for.
        - name: Restless
          slug: restless
          description: unable to settle, as if something is always unfinished
          reviewed: true
          god_sees_this:
            - Psalm 77:4
            - Job 7:4
          truth_to_hold:
            - Matthew 11:28
            - ref: Psalm 62:1
              excerpt: 'In God alone my soul finds rest; my salvation comes from Him.'
          reflection: >-
            What is keeping you from settling: something unfinished, unsaid or unknown?
          prayer: >-
            Lord, I can't seem to settle. You invited the weary to come to You, so I'm coming. Quiet my mind and teach my soul to rest in You.
          action: >-
            Put your phone in another room for ten minutes. Sit still, and each time your mind wanders, gently pray, "In God alone my soul finds rest."
        - name: Dreading
          slug: dreading
          description: bracing for something you know is coming
          reviewed: true
          god_sees_this:
            - Mark 14:35-36
            - Job 3:25-26
          truth_to_hold:
            - Deuteronomy 31:8
            - Psalm 112:7
          reflection: >-
            What are you bracing for, and what would it look like for God to be with you in that moment?
          prayer: >-
            Father, I'm dreading what's ahead. Like Jesus in the garden, I ask You to take this cup if You can. And if not, go before me and stay with me through it.
          action: >-
            Tell one trusted person what's coming and ask them to pray for you on that day.
    - name: Afraid
      slug: afraid
      description: feeling in danger, whether the threat is near or imagined
      reviewed: true
      god_sees_this:
        - Psalm 31:22
        - Matthew 14:30
      truth_to_hold:
        - Psalm 56:3-4
        - ref: Isaiah 43:1
          excerpt: 'Do not fear, for I have redeemed you; I have called you by your name; you are Mine!'
      reflection: >-
        What is the danger you sense, and is it here now or still ahead?
      prayer: >-
        God, I'm afraid. You call me by name and say I'm Yours. When fear rises, help me put my trust in You again, as many times as it takes.
      action: >-
        Each time the fear rises today, say Psalm 56:3 under your breath: "When I am afraid, I put my trust in You."
      children:
        - name: Terrified
          slug: terrified
          description: fear so strong it is hard to think or move
          reviewed: true
          god_sees_this:
            - Psalm 55:5
            - Psalm 18:4-6
          truth_to_hold:
            - ref: Mark 6:50
              excerpt: 'Take courage! It is I. Do not be afraid.'
            - ref: Psalm 46:1
              excerpt: 'God is our refuge and strength, an ever-present help in times of trouble.'
          reflection: >-
            When fear this strong takes hold, what is the smallest step toward safety or help you could take?
          prayer: >-
            Lord, I'm terrified and I can barely think. Hear my cry and be my refuge. Speak "Take courage, it is I" into this moment.
          action: >-
            If you are in danger, get to safety and call for help now. Otherwise, sit down, plant your feet, and slowly name five things you can see as you breathe.
        - name: Panicked
          slug: panicked
          description: a sudden rush of fear that floods body and mind
          reviewed: true
          god_sees_this:
            - Psalm 38:10
            - Matthew 14:30
          truth_to_hold:
            - ref: Matthew 14:31
              excerpt: 'Immediately Jesus reached out His hand and took hold of Peter.'
            - Isaiah 26:3
          reflection: >-
            When the panic passes, what did you most need to hear in the middle of it?
          prayer: >-
            Lord, save me, I'm sinking. Reach out Your hand and take hold of me as You did for Peter. Keep my mind steady on You until this wave passes.
          action: >-
            Breathe in for four counts, praying "Lord, hold me," and out for six counts, praying "I am Yours." Repeat until your breathing slows.
        - name: Threatened
          slug: threatened
          description: sensing that someone or something is against you
          reviewed: true
          god_sees_this:
            - ref: Psalm 3:1
              excerpt: 'O LORD, how my foes have increased! How many rise up against me!'
            - Psalm 31:13
          truth_to_hold:
            - Psalm 3:3
            - ref: Psalm 27:1
              excerpt: 'The LORD is my light and my salvation—whom shall I fear? The LORD is the stronghold of my life—whom shall I dread?'
          reflection: >-
            Who or what feels like it is against you, and what kind of protection do you most need?
          prayer: >-
            Lord, it feels like so much is against me. Be the shield around me and the One who lifts my head. Show me wise steps to take, and guard me from harm.
          action: >-
            If someone is threatening you, tell a person you trust today, and contact the authorities if you are in danger. Then read Psalm 3 aloud.
    - name: Insecure
      slug: insecure
      description: lacking solid ground under your feet
      reviewed: true
      god_sees_this:
        - Psalm 73:2
        - ref: Psalm 61:2
          excerpt: 'From the ends of the earth I call out to You whenever my heart is faint.'
      truth_to_hold:
        - Psalm 18:2
        - Psalm 62:6
      reflection: >-
        What do you usually lean on to feel steady, and is it holding?
      prayer: >-
        Father, I feel like the ground is shifting under me. You are my rock and my fortress. Set my feet on You, so I will not be shaken.
      action: >-
        Write down three things that are true about God and don't change when your circumstances do. Keep the note where you'll see it.
      children:
        - name: Unsafe
          slug: unsafe
          description: not able to relax because you don't feel protected
          reviewed: true
          god_sees_this:
            - Psalm 142:4
            - ref: Psalm 55:6
              excerpt: 'Oh, that I had wings like a dove! I would fly away and find rest.'
          truth_to_hold:
            - Psalm 91:1-2
            - Psalm 4:8
          reflection: >-
            Where, and with whom, do you feel safest, and how could you get there?
          prayer: >-
            Lord, I don't feel safe. Be my refuge and my fortress. Protect me, lead me to people who will help, and let me lie down in peace tonight.
          action: >-
            If you are in physical danger, contact someone you trust or emergency services now. Otherwise, name one safe person and one safe place, and reach out today.
        - name: Unsure of myself
          slug: unsure-of-myself
          description: doubting your own judgment and ability
          reviewed: true
          god_sees_this:
            - Exodus 4:10
            - Jeremiah 1:6
          truth_to_hold:
            - Exodus 4:11-12
            - 2 Corinthians 12:9
          reflection: >-
            What is God asking of you that feels bigger than you are?
          prayer: >-
            Lord, like Moses I feel I'm not enough for this. You made me, and You know my weakness. Help me as I go, and let Your strength show where mine runs out.
          action: >-
            Write down the one task you doubt you can do. Next to it write "I will help you" (Exodus 4:12), then take the first small step.
        - name: Fragile
          slug: fragile
          description: feeling one more blow could break you
          reviewed: true
          god_sees_this:
            - Psalm 6:2
            - Psalm 31:9
          truth_to_hold:
            - Isaiah 42:3
            - Psalm 34:18
          reflection: >-
            What would it look like to treat yourself as gently as God treats a bruised reed?
          prayer: >-
            Lord, I feel like one more blow could break me. You don't crush bruised reeds. Be near me, heal what hurts, and handle me gently.
          action: >-
            Postpone one non-essential thing today, and use that time to rest or to be with someone safe.
    - name: Overwhelmed
      slug: overwhelmed
      description: more coming at you than you can hold
      reviewed: true
      god_sees_this:
        - 2 Corinthians 1:8
        - Psalm 142:3
      truth_to_hold:
        - ref: Psalm 61:2
          excerpt: 'Lead me to the rock that is higher than I.'
        - Psalm 55:22
        - Isaiah 40:31
      reflection: >-
        If you could set down just one thing you're carrying, which would it be?
      prayer: >-
        Father, it is all too much, and I'm running out of strength. I cast this burden on You. Sustain me, and lead me to the rock that is higher than I.
      action: >-
        Write everything on your mind onto one page. Choose the single next step, and give the rest to God in a one-line prayer.
      children:
        - name: Pressured
          slug: pressured
          description: pushed by demands and expectations from every side
          reviewed: true
          god_sees_this:
            - Exodus 18:18
            - Psalm 25:17
          truth_to_hold:
            - 2 Corinthians 4:8-9
            - Matthew 11:29-30
          reflection: >-
            Whose expectations are you trying to meet, and are they God's?
          prayer: >-
            Jesus, I'm pressed on every side. Teach me to take Your easy yoke instead of the heavy ones I've picked up. Show me what I can lay down.
          action: >-
            Like Moses, you can't carry it alone. Ask one person today to share part of the load.
        - name: Out of control
          slug: out-of-control
          description: life is moving faster than you can steer it
          reviewed: true
          god_sees_this:
            - Mark 4:37-38
            - Psalm 107:27
          truth_to_hold:
            - Mark 4:39
            - Psalm 31:14-15
          reflection: >-
            What part of this is actually in your hands, and what part belongs only to God?
          prayer: >-
            Lord, it feels like the storm is swamping my boat. You have not forgotten me. Speak peace over this storm, and help me trust that my times are in Your hands.
          action: >-
            Divide a page into two columns, "Mine to do" and "God's to hold." Do one thing from the first column today.
        - name: Drowning
          slug: drowning
          description: going under, with no strength left to keep your head up
          reviewed: true
          god_sees_this:
            - ref: Psalm 69:1
              excerpt: 'Save me, O God, for the waters are up to my neck.'
            - Psalm 69:2
            - Jonah 2:5
          truth_to_hold:
            - Psalm 18:16
            - Isaiah 43:2
          reflection: >-
            Who could you let know that you're going under?
          prayer: >-
            Save me, O God. The waters are up to my neck. Reach down and take hold of me, and draw me out of these deep waters.
          action: >-
            Send a short message to someone you trust today: "I'm struggling and could use help." You don't have to explain everything.
    - name: Helpless
      slug: helpless
      description: unable to change what is happening
      reviewed: true
      god_sees_this:
        - 2 Chronicles 20:12
        - ref: Psalm 121:1
          excerpt: 'I lift up my eyes to the hills. From where does my help come?'
      truth_to_hold:
        - Psalm 121:2
        - ref: 2 Chronicles 20:15
          excerpt: 'Do not be afraid or discouraged because of this vast army, for the battle does not belong to you, but to God.'
      reflection: >-
        What would it look like to pray, "We do not know what to do, but our eyes are upon You"?
      prayer: >-
        God, I am powerless before this, and I don't know what to do. My eyes are on You. Fight this battle for me, and show me any part that is mine.
      action: >-
        Pray 2 Chronicles 20:12 out loud, then do one small thing that is within your reach today.
      children:
        - name: Powerless
          slug: powerless
          description: watching something unfold that you cannot stop
          reviewed: true
          god_sees_this:
            - Psalm 88:4
            - ref: Psalm 22:15
              excerpt: 'My strength is dried up like a potsherd, and my tongue sticks to the roof of my mouth.'
          truth_to_hold:
            - Isaiah 40:29
            - ref: Zechariah 4:6
              excerpt: 'Not by might nor by power, but by My Spirit, says the LORD of Hosts.'
            - 2 Corinthians 12:9
          reflection: >-
            Where have you seen God's power work through weakness before, in Scripture or in your own life?
          prayer: >-
            Lord, my strength is dried up and I can't change this. You give power to the faint. Do by Your Spirit what I cannot do by my might.
          action: >-
            Write down one time God came through when you were powerless. Read it again whenever the helplessness rises.
        - name: Trapped
          slug: trapped
          description: seeing no way out of where you are
          reviewed: true
          god_sees_this:
            - Lamentations 3:7
            - ref: Psalm 142:7
              excerpt: 'Free my soul from prison, that I may praise Your name.'
          truth_to_hold:
            - Psalm 18:19
            - Psalm 31:8
          reflection: >-
            What makes you feel there is no way out, and is that feeling the whole truth?
          prayer: >-
            Lord, I feel walled in, and I can't see a way out. Free my soul from this prison. Bring me out into the open place You have for me.
          action: >-
            Ask someone you trust to help you list possible ways forward, even small or imperfect ones. Seeing them written down can loosen the walls.
        - name: Vulnerable
          slug: vulnerable
          description: exposed and open to harm
          reviewed: true
          god_sees_this:
            - Psalm 40:17
            - Psalm 22:11
          truth_to_hold:
            - Psalm 91:4
            - Psalm 121:7-8
          reflection: >-
            Where do you feel exposed, and what kind of covering do you need?
          prayer: >-
            Lord, I am poor and needy and open to harm. Cover me with Your feathers and hide me under Your wings. Guard my coming and going.
          action: >-
            Choose one boundary that would protect you this week, and tell someone you trust about it.

- name: Sadness
  slug: sadness
  description: a heaviness of heart over what is lost, broken or not as it should be
  reviewed: true
  god_sees_this:
    - Psalm 6:6
    - John 11:35
  truth_to_hold:
    - Psalm 56:8
    - Psalm 30:5
  reflection: >-
    What exactly are you sad about, and have you said it to God plainly?
  prayer: >-
    Lord, my heart is heavy. You wept at Lazarus' tomb, so You are not ashamed of my tears. Come near to me in this sadness and comfort me in the way only You can.
  action: >-
    Find a quiet place and tell God what you are sad about, out loud or on paper, without tidying it up. Then read Psalm 56:8 slowly.
  children:
    - name: Grieving
      slug: grieving
      description: mourning someone or something you have lost
      reviewed: true
      god_sees_this:
        - Psalm 42:3
        - ref: Isaiah 53:3
          excerpt: 'He was despised and rejected by men, a man of sorrows, acquainted with grief.'
      truth_to_hold:
        - Matthew 5:4
        - Revelation 21:4
      reflection: >-
        What or who are you grieving, and what do you miss most?
      prayer: >-
        Lord, I am grieving, and this loss feels too big to hold. Jesus, You were a man of sorrows, acquainted with grief, so You understand. Comfort me while I mourn, and one day wipe away every tear.
      action: >-
        Set aside ten minutes to remember what you lost. Say it, or their name, to God, and give thanks for one specific memory.
      children:
        - name: Heartbroken
          slug: heartbroken
          description: a deep ache where love or hope used to be
          reviewed: true
          god_sees_this:
            - Psalm 31:9
            - ref: Psalm 22:14
              excerpt: 'My heart is like wax; it melts away within me.'
          truth_to_hold:
            - Psalm 34:18
            - ref: Isaiah 61:1
              excerpt: 'He has sent Me to bind up the brokenhearted'
          reflection: >-
            What did you love or hope for that now aches, and can you tell God about it in your own words?
          prayer: >-
            Lord, my heart is broken. You say You are near to the brokenhearted, so please be near to me now. Bind up this wound, gently and in Your time.
          action: >-
            Write God a short, honest letter about what broke your heart. Then read Psalm 34:18 over it.
        - name: Bereaved
          slug: bereaved
          description: grieving the death of someone you love
          reviewed: true
          god_sees_this:
            - 2 Samuel 18:33
            - John 11:33-35
          truth_to_hold:
            - 1 Thessalonians 4:13-14
            - John 11:25
          reflection: >-
            What do you most want to say to God about the person you have lost?
          prayer: >-
            Lord, someone I love has died, and the world feels wrong without them. Jesus, You wept at Your friend's grave, so You know this pain. You are the resurrection and the life; let me grieve with hope, and carry me through the hardest days.
          action: >-
            Share a memory of them with someone who knew them, or ask that person for one of theirs. If grief still floods every day months from now, look for a grief group or counsellor.
        - name: Missing someone
          slug: missing-someone
          description: longing for a person who is far away or gone
          reviewed: true
          god_sees_this:
            - 2 Timothy 1:4
            - Philippians 1:8
          truth_to_hold:
            - Romans 8:38-39
            - ref: Hebrews 13:5
              excerpt: 'Never will I leave you, never will I forsake you.'
          reflection: >-
            Who are you missing, and what about them do you miss most?
          prayer: >-
            Father, I miss them, and the space they left feels empty. Thank You for every good thing they brought into my life. Nothing can separate me from Your love, so stay close to me in the missing.
          action: >-
            If you can, send them a message today, even a short one. If you can't, write down what you would say and thank God for them.
    - name: Disappointed
      slug: disappointed
      description: what you hoped for did not happen
      reviewed: true
      god_sees_this:
        - ref: Luke 24:21
          excerpt: 'But we were hoping He was the One who would redeem Israel.'
        - Proverbs 13:12
      truth_to_hold:
        - Romans 5:5
        - Psalm 27:13-14
      reflection: >-
        What were you hoping for, and what does its not happening seem to say to you?
      prayer: >-
        Lord, I hoped for this and it didn't happen. Like the disciples on the road to Emmaus, I'm confused and let down. Walk with me in it, and show me what You are doing that I can't yet see.
      action: >-
        Tell God plainly what you hoped for. Then name one good thing He has given you that you didn't expect.
      children:
        - name: Let down
          slug: let-down
          description: someone you counted on did not come through
          reviewed: true
          god_sees_this:
            - 2 Timothy 4:16
            - Psalm 142:4
          truth_to_hold:
            - ref: 2 Timothy 4:17
              excerpt: 'But the Lord stood by me and strengthened me'
            - Isaiah 49:15
          reflection: >-
            Who let you down, and what did you need from them that you didn't get?
          prayer: >-
            Lord, I counted on them and they didn't come through. Paul knew this too, and You stood by him. Stand by me now, and help me be honest about the hurt without letting it harden my heart.
          action: >-
            Decide whether to talk to them about it or let it go. If you talk, start with what you needed, not with what they did wrong.
        - name: Discouraged
          slug: discouraged
          description: losing the heart to keep trying
          reviewed: true
          god_sees_this:
            - Nehemiah 4:10
            - Psalm 69:3
          truth_to_hold:
            - Galatians 6:9
            - 2 Corinthians 4:16
          reflection: >-
            What made you want to stop trying, and what part of it is still worth one more try?
          prayer: >-
            Lord, I'm losing heart. I've tried, and I'm tired of trying. Renew me inwardly day by day, and give me enough courage for the next small step.
          action: >-
            Pick the smallest next step, something you could do in ten minutes, and do it today. Then rest without guilt.
        - name: Unfulfilled
          slug: unfulfilled
          description: life feels smaller than you thought it would be
          reviewed: true
          god_sees_this:
            - Ecclesiastes 2:11
            - ref: Psalm 63:1
              excerpt: 'my soul thirsts for You. My body yearns for You in a dry and weary land without water.'
          truth_to_hold:
            - Ephesians 2:10
            - Psalm 16:11
          reflection: >-
            Where does life feel smaller than you hoped, and what do you think would make it feel full?
          prayer: >-
            Father, my life feels smaller than I imagined, and some of what I chased hasn't satisfied. Show me the path of life, and the good works You prepared for me, even the quiet ones.
          action: >-
            Think of one small way to serve someone this week, and do it. Afterwards, notice how it felt.
    - name: Hurt
      slug: hurt
      description: wounded by what someone said or did
      reviewed: true
      god_sees_this:
        - Psalm 69:20
        - Psalm 109:22
      truth_to_hold:
        - Psalm 147:3
        - 1 Peter 2:23
      reflection: >-
        What was said or done, and what did it make you believe about yourself?
      prayer: >-
        Lord, what they said and did hurt me. You were abused too, and You entrusted Yourself to the One who judges justly. Heal this wound, and help me leave the judging to You.
      action: >-
        Write down what happened and the lie it left you with. Next to it, write what God says is true about you.
      children:
        - name: Wounded
          slug: wounded
          description: carrying an injury that hasn't healed
          reviewed: true
          god_sees_this:
            - ref: Jeremiah 15:18
              excerpt: 'Why is my pain unending, and my wound incurable, refusing to be healed?'
            - Psalm 6:2
          truth_to_hold:
            - ref: Jeremiah 30:17
              excerpt: 'But I will restore your health and heal your wounds, declares the LORD'
            - Isaiah 42:3
          reflection: >-
            What old hurt still aches when it's touched, and what might help it heal?
          prayer: >-
            Lord, this wound hasn't healed, and sometimes it feels like it never will. You don't break a bruised reed. Be gentle with me, and heal what I can't heal myself.
          action: >-
            Name the wound to one trusted person, a friend, pastor or counsellor, and ask them to help you carry it.
        - name: Betrayed
          slug: betrayed
          description: hurt by someone you trusted
          reviewed: true
          god_sees_this:
            - Psalm 55:12-14
            - Luke 22:48
          truth_to_hold:
            - ref: Genesis 50:20
              excerpt: 'what you intended against me for evil, God intended for good'
            - Psalm 27:10
          reflection: >-
            What did you trust them with, and what do you need now to feel safe?
          prayer: >-
            Jesus, You were betrayed with a kiss by someone who shared Your table. You know this pain. Protect my heart, show me what is wise, and in Your time bring good even out of this.
          action: >-
            Put some healthy distance in place if you need it. Then tell God exactly what they did, and leave the outcome with Him for today.
        - name: Crushed
          slug: crushed
          description: pressed down so hard you can barely stand
          reviewed: true
          god_sees_this:
            - Psalm 38:8
            - ref: Psalm 143:3
              excerpt: 'For the enemy has pursued my soul, crushing my life to the ground'
          truth_to_hold:
            - 2 Corinthians 4:8-9
            - Psalm 34:19
          reflection: >-
            What is pressing down on you, and what is one thing you could set down today?
          prayer: >-
            Lord, I am pressed so hard I can barely stand. Hold me so that I'm hard pressed but not crushed. Deliver me, and give me strength for just this day.
          action: >-
            Cancel or postpone one non-essential thing today, and use the time to rest or ask someone for help.
    - name: Downcast
      slug: downcast
      description: a low, heavy spirit that won't lift
      reviewed: true
      god_sees_this:
        - Psalm 38:6
        - Psalm 143:4
      truth_to_hold:
        - Psalm 42:11
        - Psalm 3:3
      reflection: >-
        When did this heaviness start, and is there something underneath it you haven't named yet?
      prayer: >-
        Lord, my spirit is low and won't lift. Like the psalmist, I ask my soul why it is downcast, and I choose to hope in You. Lift my head when I can't lift it myself.
      action: >-
        Get outside for fifteen minutes today, in daylight if you can. If this low mood has lasted more than two weeks, tell a doctor or counsellor.
      children:
        - name: Heavy-hearted
          slug: heavy-hearted
          description: a weight on your chest you can't put down
          reviewed: true
          god_sees_this:
            - Matthew 26:38
            - ref: Psalm 31:10
              excerpt: 'For my life is consumed with grief and my years with groaning'
          truth_to_hold:
            - Matthew 11:28
            - Psalm 55:22
          reflection: >-
            What weight are you carrying, and does anyone else know about it?
          prayer: >-
            Jesus, Your soul was so heavy that You asked Your friends to stay with You. My heart is heavy too. I come to You weary and burdened; give me rest, and carry what I can't.
          action: >-
            Tell one person today, "I'm carrying something heavy," and let them pray with you or simply sit with you.
        - name: Gloomy
          slug: gloomy
          description: everything seems grey and dim
          reviewed: true
          god_sees_this:
            - Job 30:26
            - Psalm 88:18
          truth_to_hold:
            - John 1:5
            - ref: Micah 7:8
              excerpt: 'though I sit in darkness, the LORD will be my light.'
          reflection: >-
            Is there one small place today, however dim, where you can still see some light?
          prayer: >-
            Lord, everything looks grey right now. Darkness is not dark to You. Shine into this dimness, and help me notice even small glimpses of Your goodness.
          action: >-
            Open a curtain or step outside, and spend five minutes noticing one good thing: light, a sound, a taste. Thank God for it by name.
        - name: Empty
          slug: empty
          description: hollow inside, as if nothing is left
          reviewed: true
          crisis: true
          god_sees_this:
            - Job 30:16
            - Psalm 88:3
          truth_to_hold:
            - Psalm 73:26
            - Psalm 107:9
          reflection: >-
            When you feel empty, what do you usually reach for, and does it fill you?
          prayer: >-
            Lord, I feel hollow, as if nothing is left. I don't have much to bring You, so I bring You this emptiness. Be the strength of my heart, and slowly fill me again.
          action: >-
            Do one small life-giving thing today: eat a real meal, step outside, or message a friend. If the emptiness won't lift, talk to a doctor or counsellor.
    - name: Hopeless
      slug: hopeless
      description: unable to see how things could ever get better
      reviewed: true
      crisis: true
      god_sees_this:
        - Job 17:15
        - Lamentations 3:17-18
      truth_to_hold:
        - Lamentations 3:21-23
        - Romans 15:13
      reflection: >-
        What has made things feel like they can't get better, and who could help you carry it today?
      prayer: >-
        God, I can't see how this gets better, and my hope feels gone. But Your mercies are new every morning, so I'm asking for today's. Hold on to me when I can't hold on to You.
      action: >-
        Tell someone today how hopeless you feel: a friend, a pastor, a doctor or a crisis line. You don't have to feel hopeful to ask for help.
      children:
        - name: Despairing
          slug: despairing
          description: hope feels completely gone
          reviewed: true
          crisis: true
          god_sees_this:
            - 2 Corinthians 1:8
            - ref: Psalm 22:1
              excerpt: 'My God, my God, why have You forsaken me? Why are You so far from saving me, so far from my words of groaning?'
          truth_to_hold:
            - Psalm 40:2
            - ref: 2 Corinthians 1:10
              excerpt: 'He has delivered us from such a deadly peril, and He will deliver us.'
          reflection: >-
            Despair says nothing will ever change. Who could you let into this with you today?
          prayer: >-
            Lord, I'm in the pit and I can't see a way out. Paul despaired even of life, and You delivered him. Hear my cry, lift me out, and set my feet on a rock.
          action: >-
            Please don't carry this alone. Today, reach out to one person, a friend, a pastor or a doctor, or call or text 988, and say plainly, "I'm in despair."
        - name: Defeated
          slug: defeated
          description: you've fought and feel you have lost
          reviewed: true
          god_sees_this:
            - Joshua 7:7
            - Psalm 44:9
          truth_to_hold:
            - Psalm 37:24
            - ref: 2 Corinthians 12:9
              excerpt: 'My grace is sufficient for you, for My power is perfected in weakness.'
          reflection: >-
            What did you fight for and lose, and is God asking you to rise, to rest, or to let it go?
          prayer: >-
            Lord, I fought and I lost, and I feel beaten. Remind me that falling isn't the end, because You are holding my hand. Let Your power show up in my weakness.
          action: >-
            Write down what you lost and one thing you learned in the fight. Rest today; getting back up can start tomorrow.
        - name: Not wanting to live
          slug: not-wanting-to-live
          description: thoughts of not wanting to be here anymore
          reviewed: true
          crisis: true
          god_sees_this:
            - ref: 1 Kings 19:4
              excerpt: 'He sat down under a broom tree and prayed that he might die. “I have had enough, LORD,” he said. “Take my life, for I am no better than my fathers.”'
            - Job 3:11
          truth_to_hold:
            - 1 Kings 19:5-7
            - Psalm 139:16
          reflection: >-
            Who is one safe person you could tell today that you've been having these thoughts?
          prayer: >-
            God, I don't want to be here anymore, and I'm telling You honestly. You didn't turn away from Elijah when he asked to die; You gave him sleep, food and a way forward. Meet me like that, and help me reach out for help today.
          action: >-
            Please tell someone now. Call or text 988, use the helpline link above, or ask a trusted person to stay with you. If you might act on these thoughts, call your local emergency number.

- name: Anger
  slug: anger
  description: heat rising against something that feels wrong
  reviewed: true
  god_sees_this:
    - Mark 3:5
    - Psalm 39:3
  truth_to_hold:
    - ref: Psalm 4:4
      excerpt: 'Be angry, yet do not sin; on your bed, search your heart and be still.'
    - James 1:19-20
    - Psalm 103:8
  reflection: >-
    What is your anger telling you is wrong, and what do you want to do with it?
  prayer: >-
    Lord, I am angry, and I won't pretend I'm not. Jesus, You were angry at hardness of heart, so You understand this heat. Help me tell You the truth about it, and keep me from sinning in it.
  action: >-
    Before you speak or act, pause. Write down what made you angry and what you wish would happen. Then read Psalm 4:4 and, if you can, sleep on it before you respond.
  children:
    - name: Frustrated
      slug: frustrated
      description: blocked again and again from what you want or need
      reviewed: true
      god_sees_this:
        - Exodus 5:22-23
        - Numbers 11:14
      truth_to_hold:
        - Galatians 6:9
        - Proverbs 3:5-6
      reflection: >-
        What keeps blocking you, and which part of it is actually in your hands?
      prayer: >-
        Father, I keep running into the same wall, and I'm tired of it. Moses brought You his frustration, so I bring You mine. Show me what is mine to do, and give me patience for what is not.
      action: >-
        Write down what keeps blocking you. Split it into what you can change and what you can't. Take one small step on the first list today, and hand the second list to God in prayer.
      children:
        - name: Irritated
          slug: irritated
          description: small things keep rubbing you the wrong way
          reviewed: true
          god_sees_this:
            - Luke 10:40
            - Numbers 20:10
          truth_to_hold:
            - Proverbs 19:11
            - Proverbs 15:1
          reflection: >-
            Is it really the small things, or is something bigger underneath making everything rub?
          prayer: >-
            Lord, everything is getting under my skin today. Calm me before I say something I regret. Show me what's really underneath this, and give me grace to overlook what I can.
          action: >-
            When you feel yourself about to snap, stop and take three slow breaths. Ask whether you're tired, hungry, or carrying something else, and look after that first.
        - name: Impatient
          slug: impatient
          description: tired of waiting and wanting it done now
          reviewed: true
          god_sees_this:
            - ref: Psalm 13:1
              excerpt: 'How long, O LORD? Will You forget me forever?'
            - Psalm 6:3
          truth_to_hold:
            - Lamentations 3:25-26
            - Habakkuk 2:3
            - Psalm 31:15
          reflection: >-
            What are you waiting for, and what is the waiting doing in you?
          prayer: >-
            Lord, I'm tired of waiting and I want this done now. My times are in Your hands, even when Your timing feels slow. Help me wait without giving up, and show me what to do in the meantime.
          action: >-
            Name the thing you're waiting for. Then pick one good thing you can do today while you wait, and do it.
        - name: Stuck
          slug: stuck
          description: pushing hard and going nowhere
          reviewed: true
          god_sees_this:
            - Job 19:8
            - Romans 7:19
          truth_to_hold:
            - Psalm 118:5
            - Isaiah 43:19
            - 2 Corinthians 12:9
          reflection: >-
            Where are you pushing hardest, and what would it look like to stop pushing and ask for help?
          prayer: >-
            Lord, I'm pushing as hard as I can and getting nowhere. I'm out of ideas and out of strength. Make a way where I can't see one, and let Your power show up in my weakness.
          action: >-
            Stop pushing for a day. Tell one person you trust where you're stuck and ask what they see. Sometimes the next step only shows up when someone else looks.
    - name: Bitter
      slug: bitter
      description: an old hurt that has hardened inside
      reviewed: true
      god_sees_this:
        - Ruth 1:20
        - Job 7:11
      truth_to_hold:
        - Hebrews 12:15
        - Ephesians 4:31-32
      reflection: >-
        What hurt is underneath the bitterness, and have you ever told God how much it cost you?
      prayer: >-
        Lord, this old hurt has turned sour in me. Like Naomi, I feel life has dealt bitterly with me. Pull up this root before it spreads, and heal the wound underneath it.
      action: >-
        Write down the hurt your bitterness is guarding: who, what, and what it cost you. Read it to God, then read Ephesians 4:31-32.
      children:
        - name: Resentful
          slug: resentful
          description: replaying a wrong and holding it against someone
          reviewed: true
          god_sees_this:
            - Psalm 55:12-13
            - Luke 15:29
          truth_to_hold:
            - 1 Peter 2:23
            - Colossians 3:13
          reflection: >-
            How many times have you replayed this wrong, and what does replaying it give you?
          prayer: >-
            Lord, I keep replaying what they did. You saw all of it, and You judge justly. I hand this wrong to You, and I ask You to loosen its grip on my mind.
          action: >-
            The next time the memory replays, stop and pray one sentence for the person, even if all you can say is, "Lord, deal with them justly."
        - name: Unforgiving
          slug: unforgiving
          description: unable or unwilling to let a debt go
          reviewed: true
          god_sees_this:
            - Matthew 18:21
            - Psalm 109:4-5
          truth_to_hold:
            - Luke 23:34
            - Ephesians 4:32
            - Genesis 50:20
          reflection: >-
            What would forgiving them mean for you, and what would it not mean?
          prayer: >-
            Lord, I don't feel ready to forgive. What they did was real, and You know it. You have forgiven me so much; help me begin to release this debt to You, even if it takes time.
          action: >-
            Write down what they owe you, then write "I hand this to God" across it. Forgiving doesn't mean trusting them again or pretending it was fine. If it isn't safe to be near them, keep your distance.
        - name: Hardened
          slug: hardened
          description: closing your heart so it can't be hurt again
          reviewed: true
          god_sees_this:
            - Psalm 77:2
            - Jeremiah 31:15
          truth_to_hold:
            - Ezekiel 36:26
            - Isaiah 42:3
            - Psalm 147:3
          reflection: >-
            What happened that made you close your heart, and what has keeping it closed cost you?
          prayer: >-
            Lord, I shut my heart so it couldn't be hurt again, and now it feels like stone. You don't break bruised reeds. Gently soften what I've walled off, and make it safe to feel again.
          action: >-
            Tell one trusted person about the hurt you've been guarding against. Start small; one honest sentence is enough.
    - name: Enraged
      slug: enraged
      description: anger that feels too big to contain
      reviewed: true
      god_sees_this:
        - Jonah 4:9
        - Genesis 4:6
      truth_to_hold:
        - Proverbs 16:32
        - Psalm 103:8
      reflection: >-
        What would happen if you acted on this anger right now, and who would get hurt?
      prayer: >-
        God, this anger feels too big for me. You are slow to anger and rich in love; lend me Your patience. Hold me back from doing harm, and help me bring this fire to You instead.
      action: >-
        Step away now: leave the room, take a walk, or put the phone down. Don't send or say anything until you've calmed down. If you're afraid you might hurt someone, call someone you trust right away.
      children:
        - name: Furious
          slug: furious
          description: burning, explosive anger
          reviewed: true
          god_sees_this:
            - Psalm 39:3
            - Jonah 4:4
          truth_to_hold:
            - Ephesians 4:26-27
            - Proverbs 29:11
            - Psalm 37:8
          reflection: >-
            What set this off, and what hurt or fear is under the fury?
          prayer: >-
            Lord, I am burning with anger right now. Cool my body and slow my words. Show me the hurt underneath, and keep me from doing what I'll regret.
          action: >-
            Move your body: walk fast, or climb the stairs until the surge passes. Then write down what set you off before you speak to anyone about it.
        - name: Vengeful
          slug: vengeful
          description: wanting the one who hurt you to pay
          reviewed: true
          god_sees_this:
            - Psalm 58:6
            - Psalm 7:6
          truth_to_hold:
            - Romans 12:19
            - Proverbs 20:22
            - Romans 12:21
          reflection: >-
            What do you want them to suffer, and can you hand that exact wish to God instead of acting on it?
          prayer: >-
            God, I want them to pay for what they did. The psalmists prayed this honestly to You, so I will too. Vengeance is Yours, not mine. Do what is just, and keep my hands from harm.
          action: >-
            Tell God your wish for revenge, out loud or on paper, and leave it with Him. If you are planning to hurt someone, stop and talk to a trusted person or counsellor today.
    - name: Wronged
      slug: wronged
      description: treated unfairly, and it isn't being made right
      reviewed: true
      god_sees_this:
        - Psalm 35:11-12
        - Job 19:7
      truth_to_hold:
        - Psalm 10:14
        - Deuteronomy 32:4
      reflection: >-
        What was done to you, and what would "made right" look like?
      prayer: >-
        Lord, I was treated unfairly, and no one is making it right. You see it all, and You love justice. Defend my cause, and keep me from turning bitter while I wait.
      action: >-
        Write down plainly what happened. If there's a fair way to seek justice, like a conversation, a complaint or a report, take the first step. Leave the rest with God.
      children:
        - name: Cheated
          slug: cheated
          description: robbed of what was rightfully yours
          reviewed: true
          god_sees_this:
            - Genesis 27:36
            - Genesis 31:41
          truth_to_hold:
            - Genesis 31:42
            - Joel 2:25
            - ref: Isaiah 61:8
              excerpt: 'For I, the LORD, love justice; I hate robbery and iniquity'
          reflection: >-
            What was taken from you, and what do you fear it means for your future?
          prayer: >-
            Lord, I was robbed of what was mine. Laban cheated Jacob, but You saw his toil and did not let him be sent away empty-handed. See me too, and provide what was taken.
          action: >-
            If you can, seek fair redress: ask for it back, get advice, or report it. Then tell God exactly what you lost.
        - name: Disrespected
          slug: disrespected
          description: treated as if you don't matter
          reviewed: true
          god_sees_this:
            - Psalm 123:3-4
            - Psalm 69:20
          truth_to_hold:
            - ref: Isaiah 43:4
              excerpt: 'Because you are precious and honored in My sight, and because I love you'
            - Luke 12:7
          reflection: >-
            Whose opinion of you is weighing on you, and what does God say about your worth?
          prayer: >-
            Lord, I was treated as if I don't matter. Jesus, You were mocked and scorned, so You know this sting. Remind me that I am precious and honoured in Your sight.
          action: >-
            Read Isaiah 43:4 aloud. If the disrespect keeps happening, decide on one calm, clear boundary and say it. If someone is mistreating or abusing you, tell a person you trust.
        - name: Indignant
          slug: indignant
          description: angry at injustice done to you or to others
          reviewed: true
          god_sees_this:
            - Habakkuk 1:2-3
            - Psalm 94:3
          truth_to_hold:
            - Psalm 7:11
            - Amos 5:24
            - Micah 6:8
          reflection: >-
            What injustice is stirring you, and what one thing could you do about it?
          prayer: >-
            Lord, I'm angry at what's being done. You love justice more than I do. Let this anger move me to do right, not to hate, and bring justice where I can't.
          action: >-
            Choose one concrete way to act on this injustice this week: speak up, give, volunteer, or stand with someone affected.
    - name: Envious
      slug: envious
      description: pained by what others have that you don't
      reviewed: true
      god_sees_this:
        - Psalm 73:2-3
        - Psalm 73:21-22
      truth_to_hold:
        - Psalm 73:25-26
        - Proverbs 14:30
      reflection: >-
        What do they have that you want, and what do you believe it would give you?
      prayer: >-
        Lord, I'm envious of what others have. Like Asaph, I looked at them and nearly slipped. Be my portion, and teach me to want You more than what they have.
      action: >-
        Name what you envy and who has it. Pray a blessing over that person by name, then thank God for three things He has given you.
      children:
        - name: Jealous
          slug: jealous
          description: afraid of losing what or who you love to someone else
          reviewed: true
          god_sees_this:
            - Genesis 30:1
            - ref: Song of Solomon 8:6
              excerpt: 'For love is as strong as death, its jealousy as unrelenting as Sheol.'
          truth_to_hold:
            - 1 John 4:18
            - Jeremiah 31:3
          reflection: >-
            What are you afraid of losing, and what would it mean to you if you did?
          prayer: >-
            Lord, I'm afraid of losing someone I love, and I'm holding on too tightly. Remind me of Your everlasting love, and help me love without fear.
          action: >-
            Name the fear behind your jealousy in one sentence. If it's about a relationship, talk honestly with the person, calmly and without accusing.
        - name: Discontent
          slug: discontent
          description: unable to be at peace with what you have
          reviewed: true
          god_sees_this:
            - Numbers 11:4-5
            - Ecclesiastes 4:4
          truth_to_hold:
            - Philippians 4:11
            - Psalm 16:5-6
            - 1 Timothy 6:6
          reflection: >-
            What do you keep thinking would finally make you content?
          prayer: >-
            Lord, I can't seem to be at peace with what I have. Paul learned to be content; teach me too. Be my portion, and open my eyes to the good You've already given.
          action: >-
            Write down ten things you have today that you're grateful for, then read the list aloud to God.
    - name: Angry with God
      slug: angry-with-god
      description: hurt and angry at God for what He has allowed
      reviewed: true
      god_sees_this:
        - Job 30:20-21
        - Psalm 88:14
      truth_to_hold:
        - ref: Psalm 62:8
          excerpt: 'Trust in Him at all times, O people; pour out your hearts before Him. God is our refuge.'
        - Hebrews 4:15-16
      reflection: >-
        What do you want to say to God about what He allowed, and have you said it to Him directly?
      prayer: >-
        God, I'm angry with You. I don't understand why You allowed this. Job poured out his anguish to You, and You answered him; I'm bringing mine to You too. Please don't let go of me.
      action: >-
        Pour out your heart to God, out loud or on paper. Don't clean it up; He can handle it. Then read Psalm 62:8.
      children:
        - name: Disappointed in God
          slug: disappointed-in-god
          description: God did not do what you hoped He would
          reviewed: true
          god_sees_this:
            - John 11:21
            - Psalm 22:2
          truth_to_hold:
            - Isaiah 55:8-9
            - Lamentations 3:22-23
          reflection: >-
            What did you hope God would do, and what did it mean to you when He didn't?
          prayer: >-
            Lord, I hoped You would act, and You didn't. Like Martha, I want to say, "If You had been here." I don't understand Your ways, but I'm still here talking to You. Meet me in this disappointment.
          action: >-
            Finish this sentence to God, honestly: "Lord, if You had..." Then read John 11:32-35 and notice how Jesus met Mary in her disappointment.
        - name: Feeling God is unfair
          slug: god-is-unfair
          description: it seems God blesses others and passes you by
          reviewed: true
          god_sees_this:
            - Jeremiah 12:1
            - Psalm 73:13
          truth_to_hold:
            - Luke 15:31
            - Psalm 145:17
          reflection: >-
            Who seems blessed in a way you're not, and what do you want God to give you?
          prayer: >-
            Lord, it seems You bless others and pass me by. Like Jeremiah, I want to plead my case with You. Show me that You are with me, and that what is Yours is mine, even when I can't see it.
          action: >-
            Write down what feels unfair as an honest complaint to God, the way Jeremiah did. Then list three ways God has been with you that you might have missed.

